<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>Mantenimiento Vehículos</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:13px 15px;background:#e9edf2;color:#17202a;font-weight:700}button.primary{background:#1769e0;color:white}button.danger{background:#ffe5e5;color:#b42318}.app{max-width:760px;margin:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.title{font-size:28px;font-weight:800}.sub{color:#697586}.card{background:white;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.vehicle{cursor:pointer}.vehicle h3{margin:0 0 4px;font-size:18px}.km{font-size:15px;color:#667085}.status{margin-top:12px;font-weight:750}.green{color:#17803d}.orange{color:#b26a00}.red{color:#c62828}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.section{margin-top:22px;font-size:16px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:13px}.muted{color:#7b8794}.form{background:white;border-radius:18px;padding:16px;margin:10px 0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;color:#667085;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 12px;border-radius:999px;background:#edf1f5}.chip.on{background:#dbeafe;color:#1455a0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e7ec;padding:10px 12px;display:flex;justify-content:center;z-index:5}.bottom button{flex:1;max-width:240px}.hidden{display:none}.bigkm{font-size:32px;font-weight:850}.back{background:transparent;padding:5px 0;color:#1769e0}.expense{font-size:28px;font-weight:850}.line{padding:12px 0;border-bottom:1px solid #edf0f3}.line:last-child{border-bottom:0}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#17202a;color:white;padding:10px 14px;border-radius:999px;display:none;z-index:10}.dangerText{color:#b42318}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const KEY='mv_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{vehicles:[],maintenance:[]};let screen='home',selected=null,filter='all';
const types={car:['Aceite','Filtro aceite','Filtro aire','Filtro habitáculo','Refrigerante','Líquido frenos','Frenos','Neumáticos','Batería','Distribución','Suspensión','ITV'],bike:['Aceite','Filtro aceite','Filtro aire','Líquido frenos','Frenos','Neumáticos','Batería','Cadena','Transmisión','Válvulas','Suspensión','ITV'],bicycle:['Cadena','Pastillas de freno','Neumáticos','Cassette','Suspensión','Purgado de frenos','Transmisión','Revisión','Otro']};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){return Number(n||0).toLocaleString('es-ES')}function eur(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function vehicle(id){return db.vehicles.find(v=>v.id===id)}
function nextInfo(v){let ms=db.maintenance.filter(m=>m.vehicleId===v.id&&m.next);let due=[];for(const m of ms){let n=m.next, remainingKm=n.km?Number(n.km)-Number(v.km||0):Infinity;let remainingDays=n.date?Math.ceil((new Date(n.date)-new Date())/86400000):Infinity;if(remainingKm<=0||remainingDays<=0)due.push({m,over:true,remainingKm,remainingDays});else due.push({m,over:false,remainingKm,remainingDays})}due.sort((a,b)=>Math.min(a.remainingKm,a.remainingDays*1000)-Math.min(b.remainingKm,b.remainingDays*1000));return due[0]}
function status(v){let x=nextInfo(v);if(!x)return '<span class="green">🟢 Todo al día</span>';if(x.over)return '<span class="red">🔴 '+esc(x.m.type)+' pendiente</span>';let text=x.remainingKm<Infinity?'En '+fmt(x.remainingKm)+' km':('En '+fmt(x.remainingDays)+' días');return '<span class="orange">🟠 '+esc(x.m.type)+' · '+text+'</span>'}
function home(){screen='home';render()}function render(){let a=document.getElementById('app');if(screen==='home')a.innerHTML=homeHTML();else if(screen==='vehicle')a.innerHTML=vehicleHTML();else if(screen==='add')a.innerHTML=addHTML();else if(screen==='record')a.innerHTML=recordHTML();else if(screen==='history')a.innerHTML=historyHTML();else if(screen==='maintenance')a.innerHTML=maintenanceHTML();else if(screen==='expenses')a.innerHTML=expensesHTML();}
function header(title,back=true){return `<div class="top"><div>${back?'<button class="back" onclick="home()">← Volver</button>':''}<div class="title">${title}</div></div></div>`}
function homeHTML(){return `<div class="app"><div class="top"><div><div class="title">Mis vehículos</div><div class="sub">Mantenimiento sencillo y rápido</div></div><button class="primary" onclick="screen='add';render()">＋ Añadir</button></div>${db.vehicles.length?db.vehicles.map(v=>`<div class="card vehicle" onclick="selected='${v.id}';screen='vehicle';render()"><h3>${esc(v.name)}</h3><div class="km">${fmt(v.km)} km · ${v.kind==='car'?'🚗 Coche':v.kind==='bike'?'🏍️ Moto':'🚲 Bicicleta'}</div><div class="status">${status(v)}</div></div>`).join(''):'<div class="card"><b>Aún no tienes vehículos.</b><div class="sub" style="margin-top:6px">Añade el primero y empezamos a registrar su mantenimiento.</div></div>'}<div class="section">Accesos rápidos</div><div class="grid"><button onclick="screen='maintenance';render()">🔧 Mantenimientos</button><button onclick="screen='expenses';render()">💰 Gastos</button></div></div><div class="bottom"><button onclick="screen='maintenance';render()">🔧 Mantenimientos</button><button onclick="screen='expenses';render()">💰 Gastos</button></div>`}
function vehicleHTML(){let v=vehicle(selected);return `<div class="app">${header(esc(v.name))}<div class="card"><div class="bigkm">${fmt(v.km)} km</div><div class="toolbar" style="margin-top:12px"><button onclick="updateKm()">📏 Actualizar km</button><button onclick="editVehicle()">✏️ Editar</button></div></div><div class="section">Próximos mantenimientos</div>${upcoming(v)}<div class="section">Último mantenimiento</div>${last(v)||'<div class="card muted">Todavía no hay mantenimientos registrados.</div>'}<div class="toolbar" style="margin-top:18px"><button class="primary" style="flex:1" onclick="screen='record';render()">＋ REGISTRAR MANTENIMIENTO</button><button onclick="screen='history';render()">📋 Historial</button></div></div>`}
function upcoming(v){let arr=db.maintenance.filter(m=>m.vehicleId===v.id&&m.next).map(m=>{let r=m.next.km?m.next.km-v.km:null;return {m,r}}).sort((a,b)=>(a.r??999999999)-(b.r??999999999)).slice(0,5);if(!arr.length)return '<div class="card muted">No hay mantenimientos programados.</div>';return arr.map(x=>`<div class="card"><div class="row"><b>${esc(x.m.type)}</b><span class="${x.r!=null&&x.r<=0?'red':'orange'}">${x.r!=null?(x.r<=0?'Pendiente':'En '+fmt(x.r)+' km'):'Programado'}</span></div></div>`).join('')}
function last(v){let arr=db.maintenance.filter(m=>m.vehicleId===v.id).sort((a,b)=>new Date(b.date)-new Date(a.date));let m=arr[0];return m?`<div class="card"><b>${new Date(m.date).toLocaleDateString('es-ES')}</b> · ${fmt(m.km)} km<div style="margin-top:7px">${m.types.map(esc).join(' + ')}</div><div style="margin-top:7px;font-weight:750">${eur(m.total)}</div></div>`:''}
function addHTML(){return `<div class="app">${header('Añadir vehículo')}<div class="form"><div class="section">Tipo de vehículo</div><div class="chips" style="margin-top:10px"><button class="chip ${addKind==='car'?'on':''}" onclick="addKind='car';render()">🚗 Coche</button><button class="chip ${addKind==='bike'?'on':''}" onclick="addKind='bike';render()">🏍️ Moto</button><button class="chip ${addKind==='bicycle'?'on':''}" onclick="addKind='bicycle';render()">🚲 Bicicleta</button></div><div class="field"><label>Nombre</label><input id="aname" placeholder="Mercedes E 320 CDI"></div><div class="field"><label>Marca</label><input id="abrand" placeholder="Mercedes-Benz"></div><div class="field"><label>Modelo</label><input id="amodel" placeholder="E 320 CDI"></div><div class="field"><label>Año</label><input id="ayear" type="number" placeholder="2006"></div><div class="field"><label>Kilómetros actuales</label><input id="akm" type="number" placeholder="247350"></div><button class="primary" style="width:100%" onclick="createVehicle()">GUARDAR VEHÍCULO</button></div></div>`}
let addKind='car';function createVehicle(){let name=document.getElementById('aname').value.trim();if(!name)return toast('Pon un nombre al vehículo');let v={id:crypto.randomUUID(),name,brand:document.getElementById('abrand').value,model:document.getElementById('amodel').value,year:document.getElementById('ayear').value,km:Number(document.getElementById('akm').value||0),kind:addKind};db.vehicles.push(v);save();selected=v.id;screen='vehicle';render();toast('Vehículo creado')}
function updateKm(){let v=vehicle(selected),n=prompt('Kilómetros actuales',v.km);if(n!==null&&n!==''&&!isNaN(n)){v.km=Math.max(0,Number(n));save();render()}}
function editVehicle(){let v=vehicle(selected),n=prompt('Nombre del vehículo',v.name);if(n){v.name=n;save();render()}}
let recTypes=[];function recordHTML(){let v=vehicle(selected),ts=types[v.kind]||types.car;return `<div class="app">${header('Registrar mantenimiento')}<div class="form"><div class="sub">${esc(v.name)}</div><div class="field"><label>Fecha</label><input id="rdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Kilómetros</label><input id="rkm" type="number" value="${v.km}"></div><div class="field"><label>¿Qué has hecho?</label><div class="chips">${ts.map(t=>`<button class="chip ${recTypes.includes(t)?'on':''}" onclick="toggleType('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('')}</div></div><div class="field"><label>Coste total</label><input id="rtotal" type="number" step="0.01" placeholder="62.40"></div><div class="field"><button class="chip" onclick="toggleBreakdown()">＋ Desglosar coste</button><div id="break" class="hidden"><div id="breakRows"></div><button style="margin-top:8px" onclick="addBreak()">＋ Añadir</button></div></div><div class="field"><label>Notas</label><textarea id="rnotes" placeholder="Qué has hecho, piezas, aceite, observaciones..."></textarea></div><div class="field"><label>Programar próximo mantenimiento</label><select id="repeat"><option value="">No repetir</option><option value="km">Cada X km</option><option value="months">Cada X meses</option><option value="both">X km / X meses</option></select></div><div id="repeatFields"></div><button class="primary" style="width:100%" onclick="saveRecord()">GUARDAR MANTENIMIENTO</button></div></div>`}
function toggleType(t){recTypes=recTypes.includes(t)?recTypes.filter(x=>x!==t):[...recTypes,t];render()}function toggleBreakdown(){document.getElementById('break').classList.toggle('hidden')}function addBreak(){let r=document.getElementById('breakRows');let d=document.createElement('div');d.className='row';d.style.margin='7px 0';d.innerHTML=`<input placeholder="${recTypes[0]||'Elemento'}" style="flex:1"><input type="number" step="0.01" placeholder="0,00" style="width:110px">`;r.appendChild(d)}
function saveRecord(){let v=vehicle(selected),date=document.getElementById('rdate').value,km=Number(document.getElementById('rkm').value||0),total=Number(document.getElementById('rtotal').value||0);if(!recTypes.length)return toast('Selecciona al menos un trabajo');let m={id:crypto.randomUUID(),vehicleId:v.id,date,km,types:[...recTypes],total,notes:document.getElementById('rnotes').value,next:null};let repeat=document.getElementById('repeat').value;if(repeat){let x=prompt(repeat==='months'?'¿Cada cuántos meses?':'¿Cada cuántos km?','10000');if(x){if(repeat==='months')m.next={date:new Date(new Date(date).setMonth(new Date(date).getMonth()+Number(x))).toISOString().slice(0,10)};else if(repeat==='km')m.next={km:km+Number(x)};else {let y=prompt('¿Cada cuántos meses?','12');m.next={km:km+Number(x),date:new Date(new Date(date).setMonth(new Date(date).getMonth()+Number(y||12))).toISOString().slice(0,10)}}}}db.maintenance.push(m);if(km>v.km)v.km=km;save();recTypes=[];screen='vehicle';render();toast('Mantenimiento guardado')}
function historyHTML(){let v=vehicle(selected),arr=db.maintenance.filter(m=>m.vehicleId===v.id);if(filter!=='all')arr=arr.filter(m=>m.types.some(t=>t.toLowerCase().includes(filter)));arr.sort((a,b)=>new Date(b.date)-new Date(a.date));return `<div class="app">${header('Historial')}<div class="card"><input placeholder="🔍 Buscar en historial..." oninput="searchHistory(this.value)"></div><div class="chips"><button class="chip ${filter==='all'?'on':''}" onclick="filter='all';render()">TODO</button><button class="chip ${filter==='aceite'?'on':''}" onclick="filter='aceite';render()">ACEITE</button><button class="chip ${filter==='frenos'?'on':''}" onclick="filter='frenos';render()">FRENOS</button><button class="chip ${filter==='neumáticos'?'on':''}" onclick="filter='neumáticos';render()">NEUMÁTICOS</button></div>${arr.length?arr.map(m=>`<div class="card"><div class="row"><b>${new Date(m.date).toLocaleDateString('es-ES')}</b><span>${fmt(m.km)} km</span></div><div style="margin-top:9px">${m.types.map(esc).join(' + ')}</div><div style="margin-top:7px;font-weight:750">${eur(m.total)}</div>${m.notes?`<div class="sub small" style="margin-top:7px">${esc(m.notes)}</div>`:''}</div>`).join(''):'<div class="card muted">No hay registros.</div>'}</div>`}
function searchHistory(q){let v=vehicle(selected);let cards=[...document.querySelectorAll('.card')];cards.forEach(c=>{let text=c.textContent.toLowerCase();c.style.display=!q||text.includes(q.toLowerCase())?'':'none'})}
function maintenanceHTML(){let all=[];db.vehicles.forEach(v=>db.maintenance.filter(m=>m.next).forEach(m=>{let km=m.next.km!=null?m.next.km-v.km:null;let days=m.next.date?Math.ceil((new Date(m.next.date)-new Date())/86400000):null;all.push({v,m,km,days})}));all.sort((a,b)=>Math.min(a.km??999999999,(a.days??999999)*1000)-Math.min(b.km??999999999,(b.days??999999)*1000));return `<div class="app">${header('Mantenimientos',false)}${['🔴 Pendientes','🟠 Próximamente','🟢 Más adelante'].map((g,i)=>{let rows=all.filter(x=>i===0?((x.km!=null&&x.km<=0)||(x.days!=null&&x.days<=0)):i===1?((x.km!=null&&x.km>0&&x.km<=2000)||(x.days!=null&&x.days>0&&x.days<=60)):true).slice(0,i===2?20:10);return `<div class="section">${g}</div>${rows.map(x=>`<div class="card" onclick="selected='${x.v.id}';screen='record';render()"><b>${esc(x.v.name)}</b><div class="small muted">${fmt(x.v.km)} km</div><div style="margin-top:7px">${esc(x.m.type)} · ${x.km!=null?(x.km<=0?'Pendiente':'En '+fmt(x.km)+' km'):(x.days<=0?'Pendiente':'En '+x.days+' días')}</div></div>`).join('')||'<div class="card muted">Nada aquí.</div>'}`}).join('')}</div><div class="bottom"><button onclick="home()">🏠 Vehículos</button><button onclick="screen='expenses';render()">💰 Gastos</button></div>`}
function expensesHTML(){let year=new Date().getFullYear();let total=db.maintenance.filter(m=>new Date(m.date).getFullYear()===year).reduce((s,m)=>s+Number(m.total||0),0);return `<div class="app">${header('Gastos',false)}<div class="card"><div class="sub">Total gastado en ${year}</div><div class="expense">${eur(total)}</div></div><div class="section">Por vehículo</div>${db.vehicles.map(v=>{let t=db.maintenance.filter(m=>m.vehicleId===v.id&&new Date(m.date).getFullYear()===year).reduce((s,m)=>s+Number(m.total||0),0);return `<div class="card"><div class="row"><b>${esc(v.name)}</b><b>${eur(t)}</b></div></div>`}).join('')||'<div class="card muted">No hay vehículos.</div>'}</div><div class="bottom"><button onclick="home()">🏠 Vehículos</button><button onclick="screen='maintenance';render()">🔧 Mantenimientos</button></div>`}
render();
</script></body></html>
