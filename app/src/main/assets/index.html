<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.section{margin:26px 4px 10px;font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:13px}.muted{color:var(--muted)}
.form{background:var(--surface);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:110px}
.hidden{display:none}

<script>
'use strict';
const KEY='mv_v1';
const uid=()=> (crypto&&crypto.randomUUID)?crypto.randomUUID():('v_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));

db.vehicles=db.vehicles||[];db.maintenance=db.maintenance||[];db.fuel=db.fuel||[];db.obligations=db.obligations||[];
db.vehicles.forEach(v=>{v.additional=v.additional||{};if(v.startKm==null)v.startKm=Number(v.km||0);});

function migrateLegacy(){let changed=false;if(db.parts?.length){db.parts.forEach(p=>{let v=vehicle(p.vehicleId);if(v&&!db.maintenance.some(m=>m.legacyPartId===p.id)){db.maintenance.push({id:uid(),vehicleId:p.vehicleId,date:p.date||dateISO(),km:Number(p.km||v.km||0),types:['Otros'],otherText:p.description?`Pieza: ${p.description}`:'Pieza',total:Number(p.cost||0),breakdown:p.description&&Number(p.cost||0)>0?[{name:p.description,price:Number(p.cost)}]:[],notes:p.notes||'',next:null,legacyPartId:p.id});changed=true}});delete db.parts;changed=true}if(!db._obligationMigration){db.vehicles.forEach(v=>{let a=v.additional||{};if(Number(a.insuranceCost||0)>0){db.obligations.push({id:uid(),vehicleId:v.id,date:a.insuranceStart||dateISO(),type:'Seguro',cost:Number(a.insuranceCost),status:'',reason:'',notes:'Importado de una versión anterior'});changed=true}if(Number(a.taxCost||0)>0){db.obligations.push({id:uid(),vehicleId:v.id,date:a.taxDate||dateISO(),type:'Viñeta / impuesto',cost:Number(a.taxCost),status:'',reason:'',notes:'Importado de una versión anterior'});changed=true}});db._obligationMigration=true;changed=true}if(changed)save()}
function save(){
  try{
    const snapshot={...db,vehicles:db.vehicles.map(v=>{const c={...v};delete c.photo;return c;})};
    localStorage.setItem(KEY,JSON.stringify(snapshot));
    syncReminders();
    return true;
  }catch(e){
    toast(uiLang==='en'?'Could not save the data.':'No se han podido guardar los datos.');
    return false;
  }
}

story',additional:'Additional data',obligations:'Taxes & obligations',excel:'Excel',exportExcel:'Export Excel',name:'Name',brand:'Brand',model:'Model',year:'Year',photo:'Photo',remove:'Remove photo',cancel:'Cancel',save:'Save',editVehicle:'Edit vehicle',vehicleSaved:'Vehicle updated',saveChanges:'Save changes',additionalInfo:'Current technical information. Not counted as expenses.',tyres:'Tyres',frontTyres:'Front · type / model',rearTyres:'Rear · type / model',battery:'Battery',batteryType:'Type',batterySize:'Size / capacity',insurance:'Insurance',company:'Company',policy:'Policy No.',start:'Start',end:'Expiry',changesSaved:'Changes saved',recordMaintenance:'Record maintenance',editMaintenance:'Edit maintenance',date:'Date',km:'Kilometres',whatDone:'What did you do?',otherDescription:'Description for “Other”',totalCost:'Total cost',breakdown:'Break down cost',addLine:'Add line',scheduleNext:'Schedule next maintenance',doNotSchedule:'Do not schedule',everyKm:'Every X km',everyMonths:'Every X months',kmOrMonths:'X km or X months, whichever comes first',intervalKm:'Km interval',intervalMonths:'Months interval',notes:'Notes',checkData:'Check the data',selectWork:'Select at least one job',kmInterval:'Enter a km interval',monthsInterval:'Enter a months interval',notFound:'Record not found',maintenanceSaved:'Maintenance saved',maintenanceCompleted:'Maintenance completed',vehicle:'Vehicle',allVehicles:'All vehicles',period:'Period',all:'All',thisMonth:'This month',last3m:'Last 3 months',thisYear:'This year',last12m:'Last 12 months',custom:'Custom',from:'From',to:'To',costKmPeriod:'Cost/km for period',byVehicle:'By vehicle',noVehicle:'Vehicle not found',language:'Language',spanish:'Spanish',english:'English',addPhoto:'Add photo',noPhoto:'No photo',saveVehicle:'Save vehicle',saveMaintenance:'Save maintenance',newFuel:'New refuel',editFuel:'Edit refuel',liters:'Litres',pricePerLiter:'Calculated price per litre',fuelSaved:'Refuel saved',deleteFuel:'Delete refuel',newObligation:'New entry',editObligation:'Edit entry',result:'Result',favorable:'Favourable',unfavorable:'Unfavourable',reason:'Reason / defects',optionalCost:'Cost (€) · optional',description:'Notes / description',entrySaved:'Entry saved',entryDeleted:'Entry deleted',allCosts:'Period costs',costMaintenance:'Maintenance',costFuel:'Fuel',costObligations:'Taxes & obligations',noRecords:'No records.',tyreNote:'Current tyre type/model',insuranceNote:'Insurance details, no cost',editPhoto:'Change photo',removePhoto:'Remove photo',settingsLanguage:'Change the language of the whole app',duplicateGuard:'Saving…',saved:'Saved',reorder:'Sorted by latest maintenance or refuel'}};
function t(k){return (I[uiLang]||I.es)[k]||I.es[k]||k}
function tl(kind){return typeLabels[uiLang]?.[kind]||typeLabels.es[kind]}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function vehicle(id){return db.vehicles.find(v=>v.id===id)}

function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateISO(){return localISO(new Date())}
function addMonthsISO(iso,months){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));const base=m?new Date(+m[1],+m[2]-1,+m[3]):new Date();const day=base.getDate();base.setDate(1);base.setMonth(base.getMonth()+Number(months||0));const last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();base.setDate(Math.min(day,last));return localISO(base)}
function parseISO(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(iso)}
function showDate(iso){if(!iso)return '—';const d=parseISO(iso);return isNaN(d)?esc(iso):d.toLocaleDateString(uiLang==='en'?'en-GB':'es-ES')}
function activityTime(v){let d=[];db.maintenance.filter(x=>x.vehicleId===v.id&&x.date).forEach(x=>d.push(Date.parse(x.date)||0));db.fuel.filter(x=>x.vehicleId===v.id&&x.date).forEach(x=>d.push(Date.parse(x.date)||0));return d.length?Math.max(...d):0}
function kindIcon(v){return v.kind==='bike'?'🏍️':v.kind==='bicycle'?'🚲':'🚗'}
function photoMarkup(v,cls='vehiclePhoto'){return v.photo?`<img class="${cls}" src="${v.photo}" alt="${esc(v.name)}">`:`<div class="${cls} emptyPhoto">${kindIcon(v)}</div>`}
function inDateRange(d,from,to){let x=String(d||'').slice(0,10);if(!x)return false;if(from&&x<from)return false;if(to&&x>to)return false;return true}
function maintenanceCost(v,from=null,to=null){return db.maintenance.filter(m=>m.vehicleId===v.id&&inDateRange(m.date,from,to)).reduce((s,m)=>s+Number(m.total||0),0)}
function fuelCost(v,from=null,to=null){return db.fuel.filter(f=>f.vehicleId===v.id&&inDateRange(f.date,from,to)).reduce((s,f)=>s+Number(f.total||0),0)}
function obligationsCost(v,from=null,to=null){return db.obligations.filter(o=>o.vehicleId===v.id&&inDateRange(o.date,from,to)).reduce((s,o)=>s+Number(o.cost||0),0)}
function totalExpense(v,from=null,to=null){return maintenanceCost(v,from,to)+fuelCost(v,from,to)+obligationsCost(v,from,to)}
function usageExpense(v,from=null,to=null){return maintenanceCost(v,from,to)+fuelCost(v,from,to)}
function kmSinceStart(v){return Math.max(0,Number(v.km||0)-Number(v.startKm||0))}
function periodDistance(v,from,to){if(!from&&!to)return kmSinceStart(v);let pts=[];db.maintenance.filter(m=>m.vehicleId===v.id&&inDateRange(m.date,from,to)&&isFinite(Number(m.km))).forEach(m=>pts.push(Number(m.km)));db.fuel.filter(f=>f.vehicleId===v.id&&inDateRange(f.date,from,to)&&isFinite(Number(f.km))).forEach(f=>pts.push(Number(f.km)));return pts.length>1?Math.max(0,Math.max(...pts)-Math.min(...pts)):0}
function costKm(v,from=null,to=null){let d=periodDistance(v,from,to),c=usageExpense(v,from,to);return d>0?c/d:null}
function nextItems(v){return db.maintenance.filter(m=>m.vehicleId===v.id&&m.next).map(m=>{let n=m.next,remKm=n.km!=null?Number(n.km)-Number(v.km||0):Infinity,remDays=n.date?Math.ceil((parseISO(n.date)-parseISO(dateISO()))/86400000):Infinity;return {m,remKm,remDays,over:remKm<=0||remDays<=0}}).sort((a,b)=>Math.min(a.remKm,a.remDays*1000)-Math.min(b.remKm,b.remDays*1000))}
function vehicleStatus(v){let x=nextItems(v)[0];if(!x)return `<span class="green">🟢 ${uiLang==='en'?'All good':'Todo al día'}</span>`;let label=x.m.types?.[0]||t('maintenance');if(x.over)return `<span class="red">🔴 ${esc(label)} ${uiLang==='en'?'due':'pendiente'}</span>`;return `<span class="orange">🟠 ${esc(label)} · ${x.remKm<Infinity?`${uiLang==='en'?'in':'En'} ${fmt(x.remKm)} km`:`${uiLang==='en'?'in':'En'} ${fmt(x.remDays)} ${uiLang==='en'?'days':'días'}`}</span>`}
function navigate(next){window.__nav=window.__nav||[];window.__nav.push(screen);screen=next;render()}
function goBack(){let nav=window.__nav||[];screen=nav.length?nav.pop():'home';render()}
function header(title,back=true){return `<div class="top">${back?`<button class="back" onclick="goBack()" aria-label="${uiLang==='en'?'Back':'Volver'}">‹</button>`:''}<div class="title" style="flex:1">${title}</div></div>`}
function tile(icon,label,onclick,cls=''){return `<button class="tile ${cls}" onclick="${onclick}"><span class="ico">${icon}</span><span>${label}</span></button>`}




function render(){let a=document.getElementById('app');if(screen==='home')a.innerHTML=homeHTML();else if(screen==='vehicle')a.innerHTML=vehicleHTML();else if(screen==='add')a.innerHTML=addHTML();else if(screen==='editVehicle')a.innerHTML=editVehicleHTML();else if(screen==='record')a.innerHTML=recordHTML();else if(screen==='history')a.innerHTML=historyHTML();else if(screen==='maintenance')a.innerHTML=maintenanceHTML();else if(screen==='expenses')a.innerHTML=expensesHTML();else if(screen==='fuel')a.innerHTML=fuelHTML();else if(screen==='fuelForm')a.innerHTML=fuelFormHTML();else if(screen==='additional')a.innerHTML=additionalHTML();else if(screen==='obligations')a.innerHTML=obligationsHTML();else if(screen==='settings')a.innerHTML=settingsHTML();document.documentElement.lang=uiLang}
function homeHTML(){let arr=[...db.vehicles].sort((a,b)=>activityTime(b)-activityTime(a)||String(a.name||'').localeCompare(String(b.name||''),'es'));return `<div class="app"><div class="homeHead"><div><div class="title">${t('appName')}</div><div class="sub">${t('homeSub')}</div></div><button class="primary addBtn" onclick="navigate('add')">＋ ${uiLang==='en'?'Add':'Añadir'}</button></div>${backupNoticeHTML()}${arr.length?arr.map(v=>`<div class="card vehicle" onclick="selected='${v.id}';navigate('vehicle')">${photoMarkup(v)}<div class="vehicleInfo"><h3>${esc(v.name)}</h3><div class="km">${kindIcon(v)} ${fmt(v.km)} km</div><div class="status">${vehicleStatus(v)}</div></div></div>`).join(''):`<div class="card empty"><div class="big">🚗</div><b>${t('noVehicles')}</b><div class="sub" style="margin:6px 0 14px">${t('addFirst')}</div><button class="primary" onclick="navigate('add')">＋ ${t('addVehicle')}</button></div>`}<div class="section">${t('quickAccess')}</div><div class="grid">${tile('🔧',t('maintenance'),"navigate('maintenance')")}${tile('💰',t('expenses'),"expenseVehicle='all';expenseReturn='home';navigate('expenses')")}${tile('☁️',t('backup'),'backupData()')}${tile('📥',t('restore'),'restoreData()')}${tile('⚙️',t('settings'),"navigate('settings')")}</div></div>`}
function vehicleHTML(){let v=vehicle(selected);if(!v){screen='home';return homeHTML()}let tot=totalExpense(v),ck=costKm(v);return `<div class="app">${header(esc(v.name))}<div class="card hero"><div class="photoBox">${photoMarkup(v,'photoPreview')}<div style="flex:1;min-width:150px"><div class="small muted">${kindIcon(v)} ${esc([v.brand,v.model,v.year].filter(Boolean).join(' · '))}</div><div class="bigkm">${fmt(v.km)} km</div><div class="small muted" style="margin-top:4px">${t('totalSpend')}: <b>${eur(tot)}</b> · ${t('costKm')}: <b>${ck!=null?eur(ck):'—'}</b></div></div></div><div class="toolbar" style="margin-top:16px"><button onclick="updateKm()">📏 ${t('updateKm')}</button><button onclick="editVehicle()">✏️ ${t('edit')}</button><button class="danger" onclick="deleteVehicle()">🗑️ ${t('delete')}</button></div></div><div class="section">${t('upcoming')}</div>${upcomingHTML(v)}<div class="section">${t('actions')}</div><div class="grid">${tile('🔧',t('maintenance'),"editMaintenanceId=null;completeScheduledId=null;recTypes=[];breakdownOpen=false;navigate('record')",'primary')}${tile('⛽',t('quickFuel'),'quickFuel()')}${tile('📊',t('fuel'),"navigate('fuel')")}${tile('📋',t('history'),"navigate('history')")}${tile('💰',t('expenses'),`openVehicleExpenses('${v.id}')`)}${tile('📁',t('additional'),"navigate('additional')")}${tile('🧾',t('obligations'),"navigate('obligations')")}${tile('📗',t('exportExcel'),`exportExcelForVehicle('${v.id}')`)}</div><div class="section">${t('allCosts')}</div><div class="card"><div class="row"><span>🔧 ${t('costMaintenance')}</span><b>${eur(maintenanceCost(v))}</b></div><div class="row" style="margin-top:10px"><span>⛽ ${t('costFuel')}</span><b>${eur(fuelCost(v))}</b></div><div class="row" style="margin-top:10px"><span>🧾 ${t('costObligations')}</span><b>${eur(obligationsCost(v))}</b></div><div class="row divider"><b>${t('totalSpend').toUpperCase()}</b><b>${eur(tot)}</b></div></div></div>`}
function upcomingHTML(v){let arr=nextItems(v).slice(0,5);return arr.length?arr.map(x=>`<div class="card"><div class="row"><b>${esc((x.m.types||[]).map(z=>z==='Otros'&&x.m.otherText?`Otros — ${x.m.otherText}`:z).join(' + '))}</b><span class="${x.over?'red':'orange'}" style="white-space:nowrap">${x.over?'🔴 '+(uiLang==='en'?'Due':'Pendiente'):x.remKm<Infinity?'🟠 '+fmt(x.remKm)+' km':'🟠 '+fmt(x.remDays)+' días'}</span></div></div>`).join(''):`<div class="card muted">✨ ${uiLang==='en'?'No scheduled maintenance.':'No hay mantenimientos programados.'}</div>`}
function addHTML(){return `<div class="app">${header(t('addVehicle'))}<div class="form"><div class="section">${uiLang==='en'?'Vehicle type':'Tipo de vehículo'}</div><div class="chips" style="margin-top:10px"><button class="chip ${addKind==='car'?'on':''}" onclick="addKind='car';render()">🚗 ${uiLang==='en'?'Car':'Coche'}</button><button class="chip ${addKind==='bike'?'on':''}" onclick="addKind='bike';render()">🏍️ ${uiLang==='en'?'Motorcycle':'Moto'}</button><button class="chip ${addKind==='bicycle'?'on':''}" onclick="addKind='bicycle';render()">🚲 ${uiLang==='en'?'Bicycle':'Bicicleta'}</button></div><div class="field"><label>${t('name')}</label><input id="aname"></div><div class="field"><label>${t('brand')}</label><input id="abrand"></div><div class="field"><label>${t('model')}</label><input id="amodel"></div><div class="field"><label>${t('year')}</label><input id="ayear" type="number"></div><div class="field"><label>${uiLang==='en'?'Current kilometres':'Kilómetros actuales'}</label><input id="akm" type="number" step="1" inputmode="numeric"></div><div class="field"><label>${t('photo')}</label><div class="photoBox"><div id="addPhotoPreview" class="emptyPhoto">📷<br>${t('noPhoto')}</div><div><input id="photoInput" type="file" accept="image/*" onchange="readPhoto(this,'add')"></div></div></div><button class="primary" style="width:100%" onclick="createVehicle()">${t('saveVehicle')}</button></div></div>`}
function readPhoto(input,mode){
  let f=input.files&&input.files[0];
  if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    let img=new Image();
    img.onload=()=>{
      const maxSide=1400, scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const compressed=c.toDataURL('image/jpeg',0.78);
      if(mode==='add'){
        pendingPhoto=compressed;
        let el=document.getElementById('addPhotoPreview');
        if(el)el.outerHTML=`<img id="addPhotoPreview" class="photoPreview" src="${pendingPhoto}" alt="${t('photo')}">`;
      }else{
        window.editVehiclePhoto=compressed;
        let el=document.getElementById('editPhotoPreview');
        if(el)el.innerHTML=`<img class="photoPreview" src="${window.editVehiclePhoto}" alt="${t('photo')}">`;
      }
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function createVehicle(){
  if(creatingVehicle)return toast(t('duplicateGuard'));
  creatingVehicle=true;
  try{
    if(!addKind){creatingVehicle=false;return toast(uiLang==='en'?'Select the vehicle type':'Selecciona el tipo de vehículo')}
    let name=document.getElementById('aname').value.trim();
    if(!name){creatingVehicle=false;return toast(uiLang==='en'?'Enter a name':'Pon un nombre al vehículo')}
    let kmRaw=document.getElementById('akm').value.trim(),km=kmRaw===''?0:Number(kmRaw);
    if(!isFinite(km)||km<0){creatingVehicle=false;return toast(uiLang==='en'?'Invalid kilometres':'Kilómetros no válidos')}
    const id=uid();
    if(pendingPhoto && typeof Android!=='undefined' && !Android.savePhoto(id,pendingPhoto)){creatingVehicle=false;return toast(uiLang==='en'?'Could not save the photo':'No se pudo guardar la foto')}
    const v={id,name,brand:document.getElementById('abrand').value.trim(),model:document.getElementById('amodel').value.trim(),year:document.getElementById('ayear').value,km,kind:addKind,startKm:km,additional:{},photo:pendingPhoto||''};
    db.vehicles.push(v);
    if(!save()){db.vehicles=db.vehicles.filter(x=>x.id!==id);if(typeof Android!=='undefined')Android.deletePhoto(id);creatingVehicle=false;return;}
    selected=id;pendingPhoto='';addKind='';window.__nav=[];screen='home';render();toast(uiLang==='en'?'Vehicle created':'Vehículo creado');
  }finally{setTimeout(()=>creatingVehicle=false,350)}
}

function editVehicleHTML(){let v=vehicle(selected);return `<div class="app">${header(t('editVehicle'))}<div class="form"><div class="field"><label>${t('name')}</label><input id="evName" value="${esc(v.name)}"></div><div class="field"><label>${t('brand')}</label><input id="evBrand" value="${esc(v.brand||'')}"></div><div class="field"><label>${t('model')}</label><input id="evModel" value="${esc(v.model||'')}"></div><div class="field"><label>${t('year')}</label><input id="evYear" type="number" value="${esc(v.year||'')}"></div><div class="field"><label>${t('photo')}</label><div class="photoBox"><div id="editPhotoPreview">${v.photo?`<img class="photoPreview" src="${v.photo}" alt="${esc(v.name)}">`:`<div class="emptyPhoto">📷<br>${t('noPhoto')}</div>`}</div><div><input id="editPhotoInput" type="file" accept="image/*" onchange="readPhoto(this,'edit')">
<button type="button" class="danger" onclick="removeVehiclePhoto()">🗑️ ${t('removePhoto')}</button></div></div></div><button class="primary" style="width:100%" onclick="saveEditedVehicle()">${t('saveChanges')}</button></div></div>`}

  window.editVehiclePhoto='';
  const el=document.getElementById('editPhotoPreview');

}
function editVehicle(){let v=vehicle(selected);let p=v?.photo||'';if(!p&&typeof Android!=='undefined'){try{p=Android.getPhoto(v.id)||''}catch(e){}}window.editVehiclePhoto=p;window.__nav.push('vehicle');screen='editVehicle';render()}
function saveEditedVehicle(){let v=vehicle(selected);v.name=document.getElementById('evName').value.trim()||v.name;v.brand=document.getElementById('evBrand').value.trim();v.model=document.getElementById('evModel').value.trim();v.year=document.getElementById('evYear').value;let p=window.editVehiclePhoto||'';if(typeof Android!=='undefined'){if(p)Android.savePhoto(v.id,p);else Android.deletePhoto(v.id);}v.photo=p;save();goBack();toast(t('vehicleSaved'))}
function deleteVehicle(){let v=vehicle(selected);confirmApp(uiLang==='en'?'Delete '+v.name+'?':'¿Eliminar '+v.name+'?',uiLang==='en'?'All its maintenance, fuel, expenses and vehicle data will also be deleted.':'También se eliminarán sus mantenimientos, repostajes, gastos y datos del vehículo.',()=>{let id=v.id;db.vehicles=db.vehicles.filter(x=>x.id!==id);db.maintenance=db.maintenance.filter(x=>x.vehicleId!==id);db.fuel=db.fuel.filter(x=>x.vehicleId!==id);db.obligations=db.obligations.filter(x=>x.vehicleId!==id);save();window.__nav=[];selected=null;screen='home';render();toast(uiLang==='en'?'Vehicle deleted':'Vehículo eliminado')})}
function updateKm(){
  let v=vehicle(selected);if(!v)return toast(t('noVehicle'));
  openModal(uiLang==='en'?'Update kilometres':'Actualizar kilómetros',
    `<div class="field"><label>${uiLang==='en'?'Current kilometres':'Kilómetros actuales'}</label><input id="modalKm" type="number" step="1" min="0" inputmode="numeric" value="${esc(v.km)}"></div><div class="inlineNote">${uiLang==='en'?'Last recorded':'Último registrado'}: ${fmt(v.km)} km</div>`,
    `<button onclick="closeModal()">${t('cancel')}</button><button class="primary" id="modalKmOk">${t('save')}</button>`);
  const input=document.getElementById('modalKm');
  document.getElementById('modalKmOk').onclick=confirmKm;
  input.addEventListener('keydown',e=>{if(e.key==='Enter')confirmKm()});
  setTimeout(()=>{input.focus();input.select()},50);
}
function confirmKm(){
  const v=vehicle(selected),el=document.getElementById('modalKm');if(!v||!el)return closeModal();
  const raw=el.value.trim(),n=Number(raw);
  if(raw===''||!isFinite(n)||n<0)return toast(t('checkData'));
  const apply=()=>{v.km=Math.round(n);save();closeModal();render();toast(uiLang==='en'?'Kilometres updated':'Kilómetros actualizados')};
  if(n<Number(v.km||0)){
    closeModal();
    confirmApp(uiLang==='en'?'Lower kilometres?':'¿Bajar los kilómetros?',
      uiLang==='en'?`You entered ${fmt(n)} km, less than the current ${fmt(v.km)} km. Save anyway?`:`Has puesto ${fmt(n)} km, menos que los ${fmt(v.km)} km actuales. ¿Guardar igualmente?`,
      ()=>{v.km=Math.round(n);save();render();toast(uiLang==='en'?'Kilometres updated':'Kilómetros actualizados')},t('save'));
    return;
  }
  apply();
}
function scheduleFieldsHTML(mode,km='',months=''){
  if(mode==='km') return `<div class="grid"><div class="field"><label>${t('intervalKm')}</label><input id="rintervalKm" type="number" min="1" step="1" inputmode="numeric" value="${esc(km)}" placeholder="${uiLang==='en'?'Example: 10000':'Ej.: 10000'}"></div></div>`;
  if(mode==='months') return `<div class="grid"><div class="field"><label>${t('intervalMonths')}</label><input id="rintervalMonths" type="number" min="1" step="1" inputmode="numeric" value="${esc(months)}" placeholder="${uiLang==='en'?'Example: 12':'Ej.: 12'}"></div></div>`;
  if(mode==='either') return `<div class="grid"><div class="field"><label>${t('intervalKm')}</label><input id="rintervalKm" type="number" min="1" step="1" inputmode="numeric" value="${esc(km)}" placeholder="${uiLang==='en'?'Example: 10000':'Ej.: 10000'}"></div><div class="field"><label>${t('intervalMonths')}</label><input id="rintervalMonths" type="number" min="1" step="1" inputmode="numeric" value="${esc(months)}" placeholder="${uiLang==='en'?'Example: 12':'Ej.: 12'}"></div></div>`;
  return '';
}
function toggleScheduleFields(){
  const mode=document.getElementById('rrepeatType')?.value||'none';
  const box=document.getElementById('scheduleFields');
  if(!box)return;
  box.innerHTML=scheduleFieldsHTML(mode);
  box.style.display=mode==='none'?'none':'block';
}
function recordHTML(){
  let v=vehicle(selected),
      ts=tl(v.kind),
      editing=editMaintenanceId?db.maintenance.find(x=>x.id===editMaintenanceId):null,
      completing=completeScheduledId?db.maintenance.find(x=>x.id===completeScheduledId):null,
      m=editing||completing,
      chosen=m?[...(m.types||[])]:recTypes,
      n=m?.next||{},
      mode=n.km!=null&&n.date?'either':n.km!=null?'km':n.date?'months':'none';

  // When completing a scheduled maintenance, default to the current date/km
  // while preserving the existing interval so a new cycle is created.
  const dateValue=completing?dateISO():(m?.date||dateISO());
  const kmValue=completing?(v?.km??''):(m?.km??v.km);
  const intervalKm=(mode==='km'||mode==='either')&&m?Math.max(0,Number(n.km)-Number(m.km)):'';
  const intervalMonths=(mode==='months'||mode==='either')&&m?Math.max(0,Math.round((new Date(n.date)-new Date(m.date))/(30.44*86400000))):'';

  return `<div class="app">${header(completing?(uiLang==='en'?'Complete scheduled maintenance':'Realizar mantenimiento programado'):(m?t('editMaintenance'):t('recordMaintenance')))}
  <div class="form">
    <div class="sub">${esc(v.name)}</div>
    <div class="field"><label>${t('date')}</label><input id="rdate" type="date" value="${dateValue}"></div>
    <div class="field"><label>${t('km')}</label><input id="rkm" type="number" step="1" value="${kmValue}"></div>
    <div class="field"><label>${t('whatDone')}</label><div class="chips">${ts.map(x=>`<button type="button" class="chip ${chosen.includes(x)?'on':''}" onclick="toggleType('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div></div>
    <div class="field"><label>${t('otherDescription')}</label><input id="rother" value="${esc(m?.otherText||'')}" placeholder="${uiLang==='en'?'Example: Engine replacement':'Ej.: Cambio de motor completo'}"></div>
    <div class="field"><label>${t('totalCost')}</label><input id="rtotal" type="number" step="0.01" inputmode="decimal" value="${completing?'':(m?.total??'')}" placeholder="62,40" oninput="syncBreakTotal()"></div>
    <div class="field"><button type="button" class="chip" onclick="toggleBreakdown()">＋ ${t('breakdown')}</button><div id="break" class="${breakdownOpen?'':'hidden'}"><div id="breakRows"></div><button type="button" style="margin-top:8px" onclick="addBreak()">＋ ${t('addLine')}</button><div id="breakTotal" style="font-weight:800;margin-top:10px">TOTAL: 0,00 €</div></div></div>
    <div class="field"><label>🔁 ${t('scheduleNext')}</label>
      <select id="rrepeatType" onchange="toggleScheduleFields()">
        <option value="none" ${mode==='none'?'selected':''}>${t('doNotSchedule')}</option>
        <option value="km" ${mode==='km'?'selected':''}>${t('everyKm')}</option>
        <option value="months" ${mode==='months'?'selected':''}>${t('everyMonths')}</option>
        <option value="either" ${mode==='either'?'selected':''}>${t('kmOrMonths')}</option>
      </select>
    </div>
    <div id="scheduleFields" ${mode==='none'?'style="display:none"':''}>${scheduleFieldsHTML(mode,intervalKm,intervalMonths)}</div>
    <div class="field"><label>${t('notes')}</label><textarea id="rnotes">${esc(completing?'':(m?.notes||''))}</textarea></div>
    <button class="primary" style="width:100%" onclick="saveRecord()">${completing?(uiLang==='en'?'Complete maintenance':'Realizar mantenimiento'):(m?t('saveChanges'):t('saveMaintenance'))}</button>
  </div></div>`
}
function toggleType(x){recTypes=recTypes.includes(x)?recTypes.filter(y=>y!==x):[...recTypes,x];render();if(breakdownOpen)buildBreakRows()}
function toggleBreakdown(){breakdownOpen=!breakdownOpen;render();if(breakdownOpen)buildBreakRows()}
function buildBreakRows(){let r=document.getElementById('breakRows');if(!r)return;if(r.children.length===0)(recTypes.length?recTypes:['Elemento']).forEach(x=>addBreak(x));syncBreakTotal()}

function syncBreakTotal(){let sum=[...document.querySelectorAll('.bprice')].reduce((a,e)=>a+Number(e.value||0),0);let el=document.getElementById('breakTotal');if(el)el.textContent=(uiLang==='en'?'TOTAL':'TOTAL')+': '+eur(sum);let total=document.getElementById('rtotal');if(total&&breakdownOpen)total.value=sum?sum.toFixed(2):''}
function saveRecord(){
  let v=vehicle(selected),
      date=document.getElementById('rdate').value,
      km=Number(document.getElementById('rkm').value),
      total=Number(document.getElementById('rtotal').value||0),
      rep=document.getElementById('rrepeatType')?.value||'none';

  if(!date||!isFinite(km)||km<0||!isFinite(total)||total<0)return toast(t('checkData'));

  let typesChosen=[...recTypes];
  let existing=editMaintenanceId?db.maintenance.find(x=>x.id===editMaintenanceId):null;
  let scheduledBase=completeScheduledId?db.maintenance.find(x=>x.id===completeScheduledId):null;

  if(!typesChosen.length && (existing||scheduledBase))
    typesChosen=(existing||scheduledBase).types||[];
  if(!typesChosen.length)return toast(t('selectWork'));

  let breakdown=[];
  if(breakdownOpen)[...document.querySelectorAll('#breakRows .row')].forEach(r=>{
    let name=r.querySelector('.bname').value.trim(),price=Number(r.querySelector('.bprice').value||0);
    if(name)breakdown.push({name,price});
  });

  // Completing a scheduled maintenance keeps its interval, but creates a NEW
  // historical record so the previous occurrence is never lost.
  if(scheduledBase){
    const old=scheduledBase;
    const oldNext=old.next||{};
    let ik=oldNext.km!=null?Number(oldNext.km)-Number(old.km):null;
    let im=oldNext.date?Math.max(1,Math.round((new Date(oldNext.date)-new Date(old.date))/(30.44*86400000))):null;
    const next={
      km:ik!=null?km+ik:null,
      date:im!=null?addMonthsISO(date,im):null
    };

    db.maintenance.push({
      id:uid(),vehicleId:v.id,date,km,types:typesChosen,total,breakdown,
      notes:document.getElementById('rnotes').value,
      otherText:document.getElementById('rother').value,
      next
    });

    old.next=null;
    if(km>v.km)v.km=km;
    save();

    completeScheduledId=null;
    editMaintenanceId=null;
    recTypes=[];
    breakdownOpen=false;
    screen='vehicle';
    render();
    toast(uiLang==='en'?'Maintenance completed':'Mantenimiento realizado');
    return;
  }

  let next=null;
  if(rep!=='none'){
    let ik=Number(document.getElementById('rintervalKm')?.value||0),
        im=Number(document.getElementById('rintervalMonths')?.value||0);
    if((rep==='km'||rep==='either')&&ik<=0)return toast(t('kmInterval'));
    if((rep==='months'||rep==='either')&&im<=0)return toast(t('monthsInterval'));
    next={
      km:(rep==='km'||rep==='either')?km+ik:null,
      date:(rep==='months'||rep==='either')?addMonthsISO(date,im):null
    };
  }

  if(editMaintenanceId&&!existing)return toast(t('notFound'));

  if(existing){
    Object.assign(existing,{
      date,km,types:typesChosen,total,breakdown,
      notes:document.getElementById('rnotes').value,
      otherText:document.getElementById('rother').value,next
    });
  }else{
    db.maintenance.push({
      id:uid(),vehicleId:v.id,date,km,types:typesChosen,total,breakdown,
      notes:document.getElementById('rnotes').value,
      otherText:document.getElementById('rother').value,next
    });
  }

  if(km>v.km)v.km=km;
  save();
  editMaintenanceId=null;
  completeScheduledId=null;
  recTypes=[];
  breakdownOpen=false;
  screen='vehicle';
  render();
  toast(t('maintenanceSaved'));
}

function maintenanceHTML(){
  const groups={pending:[],upcoming:[],later:[]};
  const today=parseISO(dateISO());
  db.maintenance.filter(m=>m.next).forEach(m=>{
    const v=vehicle(m.vehicleId); if(!v)return;
    const kmRem=m.next.km!=null?Number(m.next.km)-Number(v.km||0):null;
    const dateRem=m.next.date?Math.ceil((parseISO(m.next.date)-today)/86400000):null;
    let group='later';
    if((kmRem!=null&&kmRem<=0)||(dateRem!=null&&dateRem<=0)) group='pending';
    else if((kmRem!=null&&kmRem<=1000)||(dateRem!=null&&dateRem<=30)) group='upcoming';
    groups[group].push({v,m,kmRem,dateRem});
  });
  const order=['pending','upcoming','later'];
  const titles={pending:'🔴 Pendientes',upcoming:'🟠 Próximos',later:'🟢 Más adelante'};
  const blocks=order.map(key=>{
    const arr=groups[key].sort((a,b)=>Math.min(a.kmRem==null?1e18:a.kmRem*1,a.dateRem==null?1e18:a.dateRem*30)-Math.min(b.kmRem==null?1e18:b.kmRem*1,b.dateRem==null?1e18:b.dateRem*30));
    return `<div class="section">${titles[key]}</div>${arr.length?arr.map(x=>{
      const label=(x.m.types||[]).map(ti=>ti==='Otros'&&x.m.otherText?`Otros — ${x.m.otherText}`:ti).join(' + ');
      let detail=x.kmRem!=null?fmt(x.kmRem)+' km':(x.dateRem!=null?x.dateRem+' días':'');
      return `<div class="card" onclick="selected='${x.v.id}';editMaintenanceId=null;completeScheduledId=null;breakdownOpen=false;recTypes=[];window.__nav.push('maintenance');screen='record';render()">
        <b>${kindIcon(x.v)} ${esc(x.v.name)}</b>
        <div class="small muted">${fmt(x.v.km)} km</div>
        <div style="margin-top:7px">${esc(label)}</div>
        <div class="small" style="margin-top:5px">${key==='pending'?'🔴 Pendiente':key==='upcoming'?'🟠 '+detail:'🟢 '+detail}</div>
        <div class="recordActions" style="margin-top:10px">
          <button type="button" onclick="event.stopPropagation();completeScheduledMaintenance('${x.m.id}')">✅ ${uiLang==='en'?'Done':'Realizar'}</button>
          <button type="button" class="danger" onclick="event.stopPropagation();deleteMaintenanceSchedule('${x.m.id}')">🗑️ ${uiLang==='en'?'Remove schedule':'Eliminar programación'}</button>
        </div>
      </div>`;
    }).join(''):`<div class="card muted">${t('noRecords')}</div>`}`;
  }).join('');
  return `<div class="app">${header(t('maintenance'))}${blocks}</div>`;
}

/* Avisos: se calculan aquí y se pasan a Android, que los revisa cada mañana aunque la app esté cerrada */
function buildReminders(){
  const en=uiLang==='en',out=[],today=dateISO();
  const push=(key,date,until,title,text)=>{if(date&&until)out.push({key,date,until,title,text})};
  db.vehicles.forEach(v=>{
    db.maintenance.filter(m=>m.vehicleId===v.id&&m.next).forEach(m=>{
      const label=(m.types||[]).map(x=>x==='Otros'&&m.otherText?m.otherText:x).join(' + ')||t('maintenance'),n=m.next,title=`${kindIcon(v)} ${v.name}: ${label}`;
      if(n.date){
        push(`m|${m.id}|${n.date}|7`,addDaysISO(n.date,-7),addDaysISO(n.date,-1),title,en?`Due on ${showDate(n.date)}`:`Toca el ${showDate(n.date)}`);
        push(`m|${m.id}|${n.date}|0`,n.date,addDaysISO(n.date,30),title,en?`Due since ${showDate(n.date)}`:`Toca desde el ${showDate(n.date)}`);
      }
      if(n.km!=null){const rem=Number(n.km)-Number(v.km||0);
        if(rem<=0)push(`m|${m.id}|${n.km}|over`,today,addDaysISO(today,30),title,en?`Overdue: it was due at ${fmt(n.km)} km`:`Pendiente: tocaba a los ${fmt(n.km)} km`);
        else if(rem<=500)push(`m|${m.id}|${n.km}|near`,today,addDaysISO(today,30),title,en?`${fmt(rem)} km to go (${fmt(n.km)} km)`:`Faltan ${fmt(rem)} km (a los ${fmt(n.km)} km)`);
      }
    });
    const a=v.additional||{};
    [['ins',a.insuranceEnd,en?'Insurance':'Seguro'],['itv',a.itvNext,'ITV']].forEach(([k,d,label])=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return;
      [[30,8],[7,1],[0,-3]].forEach(([n,stop])=>push(`${k}|${v.id}|${d}|${n}`,addDaysISO(d,-n),addDaysISO(d,-stop),`${kindIcon(v)} ${v.name}: ${label}`,en?`Expires on ${showDate(d)}`:`Vence el ${showDate(d)}`));
    });
  });
  if(db.vehicles.length){const last=localStorage.getItem('mv_last_backup'),due=last?addDaysISO(last,30):today;
    push(`backup|${due}`,due,addDaysISO(due,365),en?'☁️ Backup':'☁️ Copia de seguridad',en?'It has been a while since your last backup. Open the app to make one.':'Hace tiempo que no haces una copia. Abre la app y haz una para no perder tus datos.');}
  return out;
}

const CRC_TABLE=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipStore(files){

    parts.push(new Uint8Array(h.buffer),name,data);

    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);

  return out;
}
function xmlEsc(s){return String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function sheetXML(cols,rows){

  const cell=(v,ci,ri,type)=>{const r=colName(ci)+ri;if(v===''||v==null)return '';

    if(type&&type!=='text'&&type!=='date'){const n=Number(v);if(isFinite(n))return `<c r="${r}" s="${st[type]}"><v>${n}</v></c>`}

  const body=rows.map((row,ri)=>`<row r="${ri+2}">${row.map((v,ci)=>cell(v,ci,ri+2,cols[ci].type)).join('')}</row>`).join('');
  const last=colName(cols.length-1)+(rows.length+1);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')}</cols><sheetData>${head}${body}</sheetData>${rows.length?`<autoFilter ref="A1:${last}"/>`:''}</worksheet>`;
}

    const filename=`${base} ${dateISO()}.xlsx`,mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    if(window.Android?.saveFile){Android.saveFile(filename,mime,bytesToBase64(bytes));return}
    const url=URL.createObjectURL(new Blob([bytes],{type:mime})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  }catch(e){console.error(e);toast(uiLang==='en'?'Could not create the Excel file':'No se pudo generar el Excel')}
}
function backupData(){if(window.Android?.createBackup)Android.createBackup(`vehiculos_backup_${dateISO()}.json`,JSON.stringify({...db,_app:'vehiculos',_exported:new Date().toISOString()}));else toast(uiLang==='en'?'Backup unavailable':'Copia no disponible')}
function restoreData(){if(window.Android?.importBackup)Android.importBackup();else toast(uiLang==='en'?'Restore unavailable':'Restauración no disponible')}
const SAFE_ID=/^[A-Za-z0-9_-]{1,80}$/;
function sanitizeBackup(x){
  if(!x||typeof x!=='object'||!Array.isArray(x.vehicles))throw Error('format');
  const arr=a=>Array.isArray(a)?a.filter(o=>o&&typeof o==='object'):[];
  const num=(n,d=0)=>{n=Number(n);return isFinite(n)?n:d};
  const dt=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d||''))?String(d):'';
  const idMap={},fixId=id=>{id=String(id??'');if(SAFE_ID.test(id))return id;if(!idMap[id])idMap[id]=uid();return idMap[id]};
  const out={vehicles:[],maintenance:[],fuel:[],obligations:[],_obligationMigration:true};
  arr(x.vehicles).forEach(v=>{const photo=typeof v.photo==='string'&&/^data:image\/(jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v.photo)?v.photo:'';
    out.vehicles.push({...v,id:fixId(v.id),name:String(v.name||'—'),kind:['car','bike','bicycle'].includes(v.kind)?v.kind:'car',km:num(v.km),startKm:v.startKm==null?num(v.km):num(v.startKm),additional:v.additional&&typeof v.additional==='object'?v.additional:{},photo})});
  const ids=new Set(out.vehicles.map(v=>v.id)),own=o=>ids.has(fixId(o.vehicleId));
  const next=n=>n&&typeof n==='object'?{km:n.km==null?null:num(n.km),date:dt(n.date)||null}:null;
  arr(x.maintenance).filter(own).forEach(m=>out.maintenance.push({...m,id:fixId(m.id),vehicleId:fixId(m.vehicleId),date:dt(m.date)||dateISO(),km:num(m.km),total:num(m.total),types:Array.isArray(m.types)?m.types.map(String):['Otros'],breakdown:arr(m.breakdown).map(b=>({name:String(b.name||''),price:num(b.price)})),next:next(m.next)}));
  arr(x.fuel).filter(own).forEach(f=>out.fuel.push({...f,id:fixId(f.id),vehicleId:fixId(f.vehicleId),date:dt(f.date)||dateISO(),km:num(f.km),liters:num(f.liters),total:num(f.total),price:num(f.price)}));
  arr(x.obligations).filter(own).forEach(o=>out.obligations.push({...o,id:fixId(o.id),vehicleId:fixId(o.vehicleId),date:dt(o.date)||dateISO(),type:String(o.type||'Otros'),cost:o.cost==null||o.cost===''?null:num(o.cost)}));
  return out;
}
window.onBackupImported=text=>{
  let x;
  try{x=sanitizeBackup(JSON.parse(text))}catch(e){return toast(uiLang==='en'?'Invalid backup':'Copia no válida')}
  const en=uiLang==='en';
  confirmApp(en?'Restore this backup?':'¿Restaurar esta copia?',
    en?`Your current data (${db.vehicles.length} vehicles) will be replaced by the backup (${x.vehicles.length} vehicles).`:`Tus datos actuales (${db.vehicles.length} vehículos) se sustituirán por los de la copia (${x.vehicles.length} vehículos).`,
    ()=>{
      db=x;
      if(typeof Android!=='undefined')db.vehicles.forEach(v=>{try{if(v.photo)Android.savePhoto(v.id,v.photo);else{const p=Android.getPhoto(v.id);if(p)v.photo=p}}catch(e){}});
      if(!save())return;
      window.__nav=[];screen='home';selected=null;render();toast(en?'Backup restored':'Copia restaurada');
    },en?'Restore':'Restaurar');
};
function appBack(){if(document.getElementById('modal')){closeModal();return true}if(screen==='home')return false;goBack();return true}
window.appBack=appBack;
render();
syncReminders();
</script></body></html>
