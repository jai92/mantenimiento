<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>Vehículos</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:13px 15px;background:#e9edf2;color:#17202a;font-weight:700}button.primary{background:#1769e0;color:#fff}button.danger{background:#ffe5e5;color:#b42318}.app{max-width:760px;margin:auto;padding:calc(54px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;margin:0 0 24px;gap:12px;min-height:52px}.title{font-size:28px;font-weight:800;line-height:1.1}.sub{color:#697586}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.vehicle{cursor:pointer;display:flex;gap:14px;align-items:center}.vehiclePhoto{width:78px;height:78px;object-fit:cover;border-radius:16px;background:#edf1f5;flex:0 0 78px}.vehicleInfo{min-width:0;flex:1}.vehicle h3{margin:0 0 4px;font-size:18px}.km{font-size:15px;color:#667085}.status{margin-top:10px;font-weight:750}.green{color:#17803d}.orange{color:#b26a00}.red{color:#c62828}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.section{margin-top:22px;font-size:16px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:13px}.muted{color:#7b8794}.form{background:#fff;border-radius:18px;padding:16px;margin:10px 0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;color:#667085;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 12px;border-radius:999px;background:#edf1f5}.chip.on{background:#dbeafe;color:#1455a0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e7ec;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.bottom button{flex:1;max-width:240px}.hidden{display:none}.bigkm{font-size:32px;font-weight:850}.back{background:#e9edf2;padding:12px 18px;color:#1769e0;border-radius:12px;min-width:105px}.expense{font-size:28px;font-weight:850}.line{padding:12px 0;border-bottom:1px solid #edf0f3}.line:last-child{border-bottom:0}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:10}.photoBox{display:flex;gap:12px;align-items:center}.photoPreview{width:110px;height:90px;object-fit:cover;border-radius:16px;background:#edf1f5}.emptyPhoto{width:110px;height:90px;border-radius:16px;background:#edf1f5;display:flex;align-items:center;justify-content:center;color:#7b8794;font-size:12px;text-align:center}.reportBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.reportBtns button{flex:1;min-width:150px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modalBox{background:#fff;border-radius:20px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalBox h3{margin:0 0 14px}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.typeIcon{font-size:20px;display:inline-block;width:30px}.recordActions{display:flex;gap:8px;margin-top:12px}.recordActions button{flex:1}.statusDot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 12px}.dotGreen{background:#22a447}.dotRed{background:#d92d20}</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const KEY='mv_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{vehicles:[],maintenance:[],fuel:[],parts:[],obligations:[]};db.fuel=db.fuel||[];db.parts=db.parts||[];db.obligations=db.obligations||[];db.vehicles.forEach(v=>v.additional=v.additional||{});
let screen='home',selected=null,filter='all',expenseVehicle='all',addKind='',editFuelId=null,editPartId=null,editMaintenanceId=null,editObligationId=null;let recTypes=[];let breakdownOpen=false;let expensePeriod='all';let expenseFrom='',expenseTo='';
const types={car:['Aceite','Filtro aceite','Filtro aire','Filtro habitáculo','Refrigerante','Líquido frenos','Frenos','Neumáticos','Batería','Distribución','Suspensión','Otros'],bike:['Aceite','Filtro aceite','Filtro aire','Líquido frenos','Frenos','Neumáticos','Batería','Cadena','Transmisión','Válvulas','Suspensión','Otros'],bicycle:['Cadena','Pastillas de freno','Neumáticos','Cassette','Suspensión','Purgado de frenos','Transmisión','Revisión','Otros']};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function migrate(){let changed=false;if(!db.migrationFlags)db.migrationFlags={};db.vehicles.forEach(v=>{if(v.startKm==null){v.startKm=Number(v.km||0);changed=true}});if(!db.migrationFlags.obligationsFromAdditional){let migrated=[];db.vehicles.forEach(v=>{let a=v.additional||{};if(Number(a.insuranceCost||0)>0)migrated.push({id:crypto.randomUUID(),vehicleId:v.id,date:a.insuranceStart||new Date().toISOString().slice(0,10),type:'Seguro',cost:Number(a.insuranceCost||0),notes:'Migrado desde datos anteriores'});if(Number(a.taxCost||0)>0)migrated.push({id:crypto.randomUUID(),vehicleId:v.id,date:a.taxDate||new Date().toISOString().slice(0,10),type:'Viñeta / impuesto',cost:Number(a.taxCost||0),notes:'Migrado desde datos anteriores'});(Array.isArray(a.itv)?a.itv:[]).forEach(x=>migrated.push({id:x.id||crypto.randomUUID(),vehicleId:v.id,date:x.date||new Date().toISOString().slice(0,10),type:'ITV',cost:Number(x.cost||0),status:x.status||'favorable',reason:x.reason||'',notes:''}));});if(migrated.length){db.obligations.push(...migrated);changed=true}db.migrationFlags.obligationsFromAdditional=true}if(changed)save()}
migrate();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){return Number(n||0).toLocaleString('es-ES')}function eur(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function vehicle(id){return db.vehicles.find(v=>v.id===id)}
function maintenanceCost(v,from=null,to=null){return db.maintenance.filter(m=>m.vehicleId===v.id&&inDateRange(m.date,from,to)).reduce((s,m)=>s+Number(m.total||0),0)}
function partsCost(v,from=null,to=null){return db.parts.filter(p=>p.vehicleId===v.id&&inDateRange(p.date,from,to)).reduce((s,p)=>s+Number(p.cost||0),0)}
function fuelCost(v,from=null,to=null){return db.fuel.filter(f=>f.vehicleId===v.id&&inDateRange(f.date,from,to)).reduce((s,f)=>s+Number(f.total||0),0)}
function obligationsCost(v,from=null,to=null){return db.obligations.filter(o=>o.vehicleId===v.id&&inDateRange(o.date,from,to)).reduce((s,o)=>s+Number(o.cost||0),0)}
function totalExpenses(v,from=null,to=null){return maintenanceCost(v,from,to)+partsCost(v,from,to)+fuelCost(v,from,to)+obligationsCost(v,from,to)}
function usageExpenses(v,from=null,to=null){return maintenanceCost(v,from,to)+partsCost(v,from,to)+fuelCost(v,from,to)}
function distanceKm(v){return Math.max(0,Number(v.km||0)-Number(v.startKm||0))}
function periodDistanceKm(v,from,to){if(!from&&!to)return distanceKm(v);let pts=[];db.maintenance.filter(m=>m.vehicleId===v.id&&inDateRange(m.date,from,to)&&isFinite(Number(m.km))).forEach(m=>pts.push(Number(m.km)));db.fuel.filter(f=>f.vehicleId===v.id&&inDateRange(f.date,from,to)&&isFinite(Number(f.km))).forEach(f=>pts.push(Number(f.km)));if(pts.length<2)return 0;return Math.max(0,Math.max(...pts)-Math.min(...pts))}
function costPerKm(v,from=null,to=null){let d=periodDistanceKm(v,from,to);return d>0?usageExpenses(v,from,to)/d:null}
function costBreakdown(v,from=null,to=null){let maintenance=maintenanceCost(v,from,to),parts=partsCost(v,from,to),fuel=fuelCost(v,from,to),obligations=obligationsCost(v,from,to);return {maintenance,parts,fuel,obligations,total:maintenance+parts+fuel+obligations}}
function inDateRange(date,from,to){if(!date)return false;let d=String(date).slice(0,10);if(from&&d<from)return false;if(to&&d>to)return false;return true}
function periodRange(){if(expensePeriod==='all')return [null,null];let now=new Date(),to=now.toISOString().slice(0,10),from=new Date(now);if(expensePeriod==='month'){from.setDate(1)}else if(expensePeriod==='3m'){from.setMonth(from.getMonth()-3)}else if(expensePeriod==='year'){from.setMonth(0,1)}else if(expensePeriod==='12m'){from.setFullYear(from.getFullYear()-1)}else if(expensePeriod==='custom'){return [expenseFrom||null,expenseTo||null]}return [from.toISOString().slice(0,10),to]}
function fuelStats(v){let arr=db.fuel.filter(f=>f.vehicleId===v.id).sort((a,b)=>Number(a.km)-Number(b.km));let liters=arr.reduce((s,f)=>s+Number(f.liters||0),0),cost=fuelCost(v),cons=[];for(let i=1;i<arr.length;i++){let d=Number(arr[i].km)-Number(arr[i-1].km);if(d>0)cons.push(Number(arr[i].liters||0)/d*100)}return {liters,cost,avg:cons.length?cons.reduce((a,b)=>a+b,0)/cons.length:null};}
function photoImg(v,cls='vehiclePhoto'){return v.photo?`<img class="${cls}" src="${v.photo}">`:`<div class="${cls==='vehiclePhoto'?'vehiclePhoto emptyPhoto':'emptyPhoto'}">📷<br>Sin foto</div>`}
function nextInfo(v){let ms=db.maintenance.filter(m=>m.vehicleId===v.id&&m.next),due=[];for(const m of ms){let n=m.next,remainingKm=n.km!=null?Number(n.km)-Number(v.km||0):Infinity,remainingDays=n.date?Math.ceil((new Date(n.date)-new Date())/86400000):Infinity;if(remainingKm<=0||remainingDays<=0)due.push({m,over:true,remainingKm,remainingDays});else due.push({m,over:false,remainingKm,remainingDays})}due.sort((a,b)=>Math.min(a.remainingKm,a.remainingDays*1000)-Math.min(b.remainingKm,b.remainingDays*1000));return due[0]}
function status(v){let x=nextInfo(v);if(!x)return '<span class="green">🟢 Todo al día</span>';if(x.over)return '<span class="red">🔴 '+esc(x.m.types?.[0]||'Mantenimiento')+' pendiente</span>';let text=x.remainingKm<Infinity?'En '+fmt(x.remainingKm)+' km':('En '+fmt(x.remainingDays)+' días');return '<span class="orange">🟠 '+esc(x.m.types?.[0]||'Mantenimiento')+' · '+text+'</span>'}
function render(){let a=document.getElementById('app');if(screen==='home')a.innerHTML=homeHTML();else if(screen==='vehicle')a.innerHTML=vehicleHTML();else if(screen==='add')a.innerHTML=addHTML();else if(screen==='record')a.innerHTML=recordHTML();else if(screen==='history')a.innerHTML=historyHTML();else if(screen==='maintenance')a.innerHTML=maintenanceHTML();else if(screen==='expenses')a.innerHTML=expensesHTML();else if(screen==='fuel')a.innerHTML=fuelHTML();else if(screen==='fuelForm')a.innerHTML=fuelFormHTML();else if(screen==='parts')a.innerHTML=partsHTML();else if(screen==='additional')a.innerHTML=additionalHTML();else if(screen==='obligations')a.innerHTML=obligationsHTML();}
function goBack(){if(screen==='vehicle'||screen==='add')screen='home';else if(screen==='record'||screen==='history'||screen==='fuel'||screen==='fuelForm'||screen==='parts'||screen==='additional'||screen==='obligations')screen='vehicle';else if(screen==='expenses'||screen==='maintenance')screen='home';else screen='home';render()}function home(){screen='home';render()}function header(title,back=true){return `<div class="top">${back?'<button class="back" onclick="goBack()">← Volver</button>':'<span style="min-width:105px"></span>'}<div class="title" style="flex:1">${title}</div></div>`}
function photoImg(v,cls='vehiclePhoto'){return v.photo?`<img class="${cls}" src="${v.photo}">`:`<div class="${cls==='vehiclePhoto'?'vehiclePhoto emptyPhoto':'emptyPhoto'}">📷<br>Sin foto</div>`}
function nextInfo(v){let ms=db.maintenance.filter(m=>m.vehicleId===v.id&&m.next),due=[];for(const m of ms){let n=m.next,remainingKm=n.km!=null?Number(n.km)-Number(v.km||0):Infinity,remainingDays=n.date?Math.ceil((new Date(n.date)-new Date())/86400000):Infinity;if(remainingKm<=0||remainingDays<=0)due.push({m,over:true,remainingKm,remainingDays});else due.push({m,over:false,remainingKm,remainingDays})}due.sort((a,b)=>Math.min(a.remainingKm,a.remainingDays*1000)-Math.min(b.remainingKm,b.remainingDays*1000));return due[0]}
function status(v){let x=nextInfo(v);if(!x)return '<span class="green">🟢 Todo al día</span>';if(x.over)return '<span class="red">🔴 '+esc(x.m.type)+' pendiente</span>';let text=x.remainingKm<Infinity?'En '+fmt(x.remainingKm)+' km':('En '+fmt(x.remainingDays)+' días');return '<span class="orange">🟠 '+esc(x.m.type)+' · '+text+'</span>'}
function render(){let a=document.getElementById('app');if(screen==='home')a.innerHTML=homeHTML();else if(screen==='vehicle')a.innerHTML=vehicleHTML();else if(screen==='add')a.innerHTML=addHTML();else if(screen==='record')a.innerHTML=recordHTML();else if(screen==='history')a.innerHTML=historyHTML();else if(screen==='maintenance')a.innerHTML=maintenanceHTML();else if(screen==='expenses')a.innerHTML=expensesHTML();else if(screen==='fuel')a.innerHTML=fuelHTML();else if(screen==='fuelForm')a.innerHTML=fuelFormHTML();else if(screen==='parts')a.innerHTML=partsHTML();else if(screen==='additional')a.innerHTML=additionalHTML();else if(screen==='obligations')a.innerHTML=obligationsHTML();}
function goBack(){if(screen==='vehicle'||screen==='add')screen='home';else if(screen==='record'||screen==='history')screen='vehicle';else if(screen==='expenses'||screen==='maintenance')screen='home';else if(screen==='fuel'||screen==='fuelForm'||screen==='parts'||screen==='additional'||screen==='obligations')screen='vehicle';else screen='home';render()}function home(){screen='home';render()}function header(title,back=true){return `<div class="top">${back?'<button class="back" onclick="goBack()">← Volver</button>':'<span style="min-width:105px"></span>'}<div class="title" style="flex:1">${title}</div></div>`}
function kindIcon(v){return v.kind==='bike'?'🏍️':v.kind==='bicycle'?'🚲':'🚗'}
function activityTime(v){const dates=[];db.maintenance.filter(m=>m.vehicleId===v.id&&m.date).forEach(m=>dates.push(new Date(m.date).getTime()||0));db.fuel.filter(f=>f.vehicleId===v.id&&f.date).forEach(f=>dates.push(new Date(f.date).getTime()||0));return dates.length?Math.max(...dates):0}
function homeHTML(){const arr=[...db.vehicles].sort((a,b)=>activityTime(b)-activityTime(a)||String(a.name||'').localeCompare(String(b.name||''),'es'));return `<div class="app"><div class="top"><div style="flex:1"><div class="title">Vehículos</div><div class="sub">Mantenimiento sencillo y rápido</div></div><button class="primary" onclick="screen='add';addKind='';pendingPhoto='';render()">＋ Añadir vehículo</button></div>${arr.length?arr.map(v=>`<div class="card vehicle" onclick="selected='${v.id}';screen='vehicle';render()">${photoImg(v)}<div class="vehicleInfo"><h3><span class="typeIcon">${kindIcon(v)}</span>${esc(v.name)}</h3><div class="km">${fmt(v.km)} km</div><div class="status">${status(v)}</div></div></div>`).join(''):'<div class="card"><b>Aún no tienes vehículos.</b><div class="sub" style="margin-top:6px">Añade el primero y empezamos a registrar su mantenimiento.</div></div>'}<div class="section">Acceso rápido</div><div class="grid"><button onclick="screen='maintenance';render()">🔧 Mantenimiento</button><button onclick="expenseVehicle='all';screen='expenses';render()">💰 Gastos</button><button onclick="backupData()">☁️ Copia de seguridad</button><button onclick="restoreData()">📥 Restaurar copia</button></div></div>`}
function vehicleHTML(){let v=vehicle(selected),c=costBreakdown(v);return `<div class="app">${header(esc(v.name))}<div class="card"><div class="photoBox">${photoImg(v,'photoPreview')}<div><div class="bigkm">${fmt(v.km)} km</div><div class="small muted" style="margin-top:5px">Gasto total: ${eur(c.total)}</div><div class="small muted" style="margin-top:4px">Coste/km: ${costPerKm(v)!=null?eur(costPerKm(v))+' / km':'aún sin distancia registrada'}</div><div class="toolbar" style="margin-top:12px"><button onclick="updateKm()">📏 Actualizar km</button><button onclick="editVehicle()">✏️ Editar</button><button class="danger" onclick="deleteVehicle()">🗑️ Eliminar</button></div></div></div></div><div class="section">Próximos mantenimientos</div>${upcoming(v)}<div class="section">Acciones</div><div class="grid"><button class="primary" onclick="screen='record';recTypes=[];breakdownOpen=false;editMaintenanceId=null;render()">🔧 Mantenimiento</button><button onclick="quickFuel()">⛽ Repostaje rápido</button><button onclick="screen='fuel';render()">📊 Combustible</button><button onclick="screen='history';filter='all';render()">📋 Historial</button><button onclick="screen='expenses';expenseVehicle=v.id;render()">💰 Gastos</button><button onclick="screen='parts';editPartId=null;render()">🔩 Piezas</button><button onclick="screen='additional';render()">📁 Datos adicionales</button><button onclick="screen='obligations';editObligationId=null;render()">🧾 Impuestos y obligaciones</button></div><div class="section">Gastos</div><div class="card"><div class="row"><span>🔧 Mantenimiento</span><b>${eur(c.maintenance)}</b></div><div class="row" style="margin-top:10px"><span>🔩 Piezas</span><b>${eur(c.parts)}</b></div><div class="row" style="margin-top:10px"><span>⛽ Combustible</span><b>${eur(c.fuel)}</b></div><div class="row" style="margin-top:10px"><span>🧾 Impuestos y obligaciones</span><b>${eur(c.obligations)}</b></div><div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid #edf0f3"><b>GASTO TOTAL</b><b>${eur(c.total)}</b></div></div><div class="section">Excel</div><div class="reportBtns"><button onclick="exportExcelForVehicle('${v.id}')">📊 Exportar Excel</button></div></div>`}
function upcoming(v){let arr=db.maintenance.filter(m=>m.vehicleId===v.id&&m.next).map(m=>{let r=m.next.km!=null?m.next.km-v.km:null;let d=m.next.date?Math.ceil((new Date(m.next.date)-new Date())/86400000):null;return {m,r,d}}).sort((a,b)=>(a.r??999999999)-(b.r??999999999)).slice(0,5);if(!arr.length)return '<div class="card muted">No hay mantenimientos programados.</div>';return arr.map(x=>`<div class="card"><div class="row"><b>${esc(x.m.type)}</b><span class="${(x.r!=null&&x.r<=0)||(x.d!=null&&x.d<=0)?'red':'orange'}">${x.r!=null?(x.r<=0?'Pendiente':'En '+fmt(x.r)+' km'):(x.d<=0?'Pendiente':'En '+x.d+' días')}</span></div></div>`).join('')}
function last(v){let arr=db.maintenance.filter(m=>m.vehicleId===v.id).sort((a,b)=>new Date(b.date)-new Date(a.date)),m=arr[0];return m?`<div class="card"><b>${new Date(m.date).toLocaleDateString('es-ES')}</b> · ${fmt(m.km)} km<div style="margin-top:7px">${m.types.map(t=>t==='Otros'&&m.otherText?esc('Otros — '+m.otherText):esc(t)).join(' + ')}</div><div style="margin-top:7px;font-weight:750">${eur(m.total)}</div></div>`:''}
function addHTML(){pendingPhoto='';return `<div class="app">${header('Añadir vehículo')}<div class="form"><div class="section">Tipo de vehículo</div><div class="chips" style="margin-top:10px"><button class="chip ${addKind==='car'?'on':''}" onclick="addKind='car';render()">🚗 Coche</button><button class="chip ${addKind==='bike'?'on':''}" onclick="addKind='bike';render()">🏍️ Moto</button><button class="chip ${addKind==='bicycle'?'on':''}" onclick="addKind='bicycle';render()">🚲 Bicicleta</button></div><div class="field"><label>Nombre</label><input id="aname" placeholder="Nombre del vehículo"></div><div class="field"><label>Marca</label><input id="abrand" placeholder="Marca"></div><div class="field"><label>Modelo</label><input id="amodel" placeholder="Modelo"></div><div class="field"><label>Año</label><input id="ayear" type="number" placeholder="Año"></div><div class="field"><label>Kilómetros actuales</label><input id="akm" type="number" placeholder="Kilómetros"></div><div class="field"><label>Foto</label><div class="photoBox"><div id="addPhotoPreview" class="emptyPhoto">📷<br>Sin foto</div><div><input id="photoInput" type="file" accept="image/*" onchange="readPhoto(this)"><div class="small muted" style="margin-top:5px">Elige una foto de la galería.</div></div></div></div><button class="primary" style="width:100%" onclick="createVehicle()">GUARDAR VEHÍCULO</button></div></div>`}
let pendingPhoto='';function readPhoto(input){let f=input.files&&input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pendingPhoto=r.result;document.getElementById('addPhotoPreview').outerHTML=`<img id="addPhotoPreview" class="photoPreview" src="${pendingPhoto}">`};r.readAsDataURL(f)}
function createVehicle(){if(!addKind)return toast('Selecciona el tipo de vehículo');let name=document.getElementById('aname').value.trim();if(!name)return toast('Pon un nombre al vehículo');let v={id:crypto.randomUUID(),name,brand:document.getElementById('abrand').value,model:document.getElementById('amodel').value,year:document.getElementById('ayear').value,km:Number(document.getElementById('akm').value||0),kind:addKind,photo:pendingPhoto,startKm:Number(document.getElementById('akm').value||0)};db.vehicles.push(v);save();pendingPhoto='';selected=v.id;screen='home';render();toast('Vehículo creado')}
function openModal(title,body,actions){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalBox"><h3>${esc(title)}</h3>${body}<div class="modalActions">${actions}</div></div></div>`)}
function closeModal(){let m=document.getElementById('modal');if(m)m.remove()}
function updateKm(){let v=vehicle(selected);openModal('Actualizar kilómetros',`<div class="field"><label>Kilómetros actuales</label><input id="modalKm" type="number" step="1" value="${v.km}"></div>`,`<button onclick="closeModal()">Cancelar</button><button class="primary" onclick="let n=Number(document.getElementById('modalKm').value);if(!isFinite(n)||n<0){toast('Kilómetros no válidos');return}v=vehicle(selected);v.km=n;save();closeModal();render();toast('Kilómetros actualizados')">Guardar</button>`)}
function editVehicle(){let v=vehicle(selected);openModal('Editar vehículo',`<div class="field"><label>Nombre</label><input id="evName" value="${esc(v.name)}"></div><div class="field"><label>Marca</label><input id="evBrand" value="${esc(v.brand||'')}"></div><div class="field"><label>Modelo</label><input id="evModel" value="${esc(v.model||'')}"></div><div class="field"><label>Año</label><input id="evYear" type="number" value="${esc(v.year||'')}"></div>`,`<button onclick="closeModal()">Cancelar</button><button class="primary" onclick="let v=vehicle(selected);v.name=document.getElementById('evName').value.trim()||v.name;v.brand=document.getElementById('evBrand').value;v.model=document.getElementById('evModel').value;v.year=document.getElementById('evYear').value;save();closeModal();render();toast('Vehículo actualizado')">Guardar</button>`)}
function deleteVehicle(){let v=vehicle(selected);if(!v)return;openModal('Eliminar vehículo',`<p>¿Eliminar <b>${esc(v.name)}</b>?</p><p class="small muted">También se eliminarán sus mantenimientos, gastos, piezas, repostajes y datos adicionales.</p>`,`<button onclick="closeModal()">Cancelar</button><button class="danger" onclick="let id=selected;db.vehicles=db.vehicles.filter(x=>x.id!==id);db.maintenance=db.maintenance.filter(x=>x.vehicleId!==id);db.fuel=db.fuel.filter(x=>x.vehicleId!==id);db.parts=db.parts.filter(x=>x.vehicleId!==id);db.obligations=db.obligations.filter(x=>x.vehicleId!==id);save();selected=null;closeModal();screen='home';render();toast('Vehículo eliminado')">Eliminar</button>`)}
function recordHTML(){let v=vehicle(selected),ts=types[v.kind]||types.car,m=editMaintenanceId?db.maintenance.find(x=>x.id===editMaintenanceId):null;let chosen=m?m.types:recTypes;return `<div class="app">${header(m?'Editar mantenimiento':'Registrar mantenimiento')}<div class="form"><div class="sub">${esc(v.name)}</div><div class="field"><label>Fecha</label><input id="rdate" type="date" value="${m?m.date:new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Kilómetros</label><input id="rkm" type="number" step="1" value="${m?m.km:v.km}"></div><div class="field"><label>¿Qué has hecho?</label><div class="chips">${ts.map(t=>`<button class="chip ${chosen.includes(t)?'on':''}" onclick="toggleType('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('')}</div><div class="field"><label>Descripción para “Otros” (opcional)</label><input id="rother" value="${esc(m?.otherText||'')}" placeholder="Ej.: Cambio de motor completo"></div></div><div class="field"><label>Coste total</label><input id="rtotal" type="number" step="0.01" inputmode="decimal" value="${m?m.total:''}" placeholder="62,40"></div><div class="field"><button class="chip" onclick="toggleBreakdown()">＋ Desglosar coste</button><div id="break" class="${breakdownOpen?'':'hidden'}"><div id="breakRows"></div><button style="margin-top:8px" onclick="addBreak()">＋ Añadir</button><div id="breakTotal" style="font-weight:800;margin-top:10px">TOTAL: 0,00 €</div></div></div><div class="field"><label>Notas</label><textarea id="rnotes" placeholder="Observaciones...">${esc(m?.notes||'')}</textarea></div><button class="primary" style="width:100%" onclick="saveRecord()">${m?'GUARDAR CAMBIOS':'GUARDAR MANTENIMIENTO'}</button></div></div>`}
function toggleType(t){recTypes=recTypes.includes(t)?recTypes.filter(x=>x!==t):[...recTypes,t];render()}function toggleBreakdown(){breakdownOpen=!breakdownOpen;render();if(breakdownOpen)buildBreakRows()}
function buildBreakRows(){let r=document.getElementById('breakRows');if(!r||r.children.length)return;(recTypes.length?recTypes:['Elemento']).forEach(t=>addBreak(t));updateBreakTotal()}
function addBreak(name=''){let r=document.getElementById('breakRows');if(!r)return;let d=document.createElement('div');d.className='row';d.style.margin='7px 0';d.innerHTML=`<input class="bname" value="${esc(name)}" placeholder="Elemento" style="flex:1"><input class="bprice" type="number" step="0.01" placeholder="0,00" style="width:110px">`;r.appendChild(d);d.querySelector('.bprice').addEventListener('input',updateBreakTotal);updateBreakTotal()}
function updateBreakTotal(){let sum=[...document.querySelectorAll('.bprice')].reduce((s,e)=>s+Number(e.value||0),0);let t=document.getElementById('breakTotal');if(t)t.textContent='TOTAL: '+eur(sum);let total=document.getElementById('rtotal');if(total&&breakdownOpen)total.value=sum?sum.toFixed(2):''}
function saveRecord(){let v=vehicle(selected),date=document.getElementById('rdate').value,km=Number(document.getElementById('rkm').value||0),total=Number(document.getElementById('rtotal').value||0);if(!recTypes.length && !editMaintenanceId)return toast('Selecciona al menos un trabajo');let typesChosen=[...recTypes];if(!typesChosen.length)return toast('Selecciona al menos un trabajo');let breakdown=[];if(breakdownOpen)[...document.querySelectorAll('#breakRows .row')].forEach(r=>{let n=r.querySelector('.bname').value.trim(),p=Number(r.querySelector('.bprice').value||0);if(n)breakdown.push({name:n,price:p})});if(editMaintenanceId){let m=db.maintenance.find(x=>x.id===editMaintenanceId);m.date=date;m.km=km;m.types=[...typesChosen];m.total=total;m.breakdown=breakdown;m.notes=document.getElementById('rnotes').value;m.otherText=document.getElementById('rother')?.value||'';editMaintenanceId=null}else{db.maintenance.push({id:crypto.randomUUID(),vehicleId:v.id,date,km,types:[...typesChosen],total,breakdown,notes:document.getElementById('rnotes').value,otherText:document.getElementById('rother')?.value||'',next:null})}if(km>v.km)v.km=km;save();recTypes=[];breakdownOpen=false;screen='vehicle';render();toast('Mantenimiento guardado')}
function editMaintenance(id){editMaintenanceId=id;let m=db.maintenance.find(x=>x.id===id);recTypes=m?[...m.types]:[];breakdownOpen=false;screen='record';render()}
function removeMaintenance(id){openModal('Eliminar mantenimiento','<p>¿Eliminar este registro de mantenimiento?</p>',`<button onclick="closeModal()">Cancelar</button><button class="danger" onclick="db.maintenance=db.maintenance.filter(x=>x.id!==id);save();closeModal();render();toast('Mantenimiento eliminado')">Eliminar</button>`)}
function historyHTML(){let v=vehicle(selected),arr=db.maintenance.filter(m=>m.vehicleId===v.id);if(filter!=='all')arr=arr.filter(m=>m.types.some(t=>t.toLowerCase().includes(filter)));arr.sort((a,b)=>new Date(b.date)-new Date(a.date));return `<div class="app">${header('Historial')}<div class="reportBtns"><button onclick="exportExcelForVehicle('${selected}')">📊 Exportar Excel</button></div><div class="card"><input placeholder="🔍 Buscar en historial..." oninput="searchHistory(this.value)"></div><div class="chips"><button class="chip ${filter==='all'?'on':''}" onclick="filter='all';render()">TODO</button><button class="chip ${filter==='aceite'?'on':''}" onclick="filter='aceite';render()">ACEITE</button><button class="chip ${filter==='frenos'?'on':''}" onclick="filter='frenos';render()">FRENOS</button><button class="chip ${filter==='neumáticos'?'on':''}" onclick="filter='neumáticos';render()">NEUMÁTICOS</button></div>${arr.length?arr.map(m=>`<div class="card"><div class="row"><b>${new Date(m.date).toLocaleDateString('es-ES')}</b><span>${fmt(m.km)} km</span></div><div style="margin-top:9px">${m.types.map(t=>t==='Otros'&&m.otherText?esc('Otros — '+m.otherText):esc(t)).join(' + ')}</div><div style="margin-top:7px;font-weight:750">${eur(m.total)}</div>${m.breakdown&&m.breakdown.length?`<div class="small muted" style="margin-top:6px">${m.breakdown.map(b=>esc(b.name)+' '+eur(b.price)).join(' · ')}</div>`:''}${m.notes?`<div class="sub small" style="margin-top:7px">${esc(m.notes)}</div>`:''}<div class="recordActions"><button onclick="editMaintenance('${m.id}')">✏️ Editar</button><button class="danger" onclick="removeMaintenance('${m.id}')">🗑️ Eliminar</button></div></div>`).join(''):'<div class="card muted">No hay registros.</div>'}</div>`}
function searchHistory(q){let cards=[...document.querySelectorAll('.card')];cards.forEach((c,i)=>{if(i===0)return;let text=c.textContent.toLowerCase();c.style.display=!q||text.includes(q.toLowerCase())?'':'none'})}

function quickFuel(){editFuelId=null;screen='fuelForm';render()}
function fuelFormHTML(){let v=vehicle(selected),f=editFuelId?db.fuel.find(x=>x.id===editFuelId):null;return `<div class="app">${header(f?'Editar repostaje':'Nuevo repostaje')}<div class="form"><div class="sub">${esc(v.name)}</div><div class="field"><label>Fecha</label><input id="fdate" type="date" value="${f?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Kilómetros actuales</label><input id="fkm" type="number" step="1" inputmode="numeric" value="${f?.km??''}"></div><div class="field"><label>Litros</label><input id="fliters" type="number" step="0.01" inputmode="decimal" value="${f?.liters??''}" oninput="updateFuelPreview()"></div><div class="field"><label>Coste total</label><input id="ftotal" type="number" step="0.01" inputmode="decimal" value="${f?.total??''}" oninput="updateFuelPreview()"></div><div class="card" style="margin:8px 0"><div class="small muted">Precio por litro calculado</div><b id="fpricePreview">—</b></div><button class="primary" style="width:100%" onclick="saveFuel()">${f?'GUARDAR CAMBIOS':'GUARDAR REPOSTAJE'}</button></div></div>`}
function updateFuelPreview(){let l=Number(document.getElementById('fliters')?.value||0),t=Number(document.getElementById('ftotal')?.value||0),e=document.getElementById('fpricePreview');if(e)e.textContent=l>0?eur(t/l)+' / L':'—'}
function saveFuel(){let v=vehicle(selected),km=Number(document.getElementById('fkm').value),liters=Number(document.getElementById('fliters').value),total=Number(document.getElementById('ftotal').value);if(!isFinite(km)||!isFinite(liters)||liters<=0||!isFinite(total)||total<0)return toast('Revisa kilómetros, litros y coste total');let price=total/liters;if(editFuelId){let f=db.fuel.find(x=>x.id===editFuelId);Object.assign(f,{date:document.getElementById('fdate').value,km,liters,total,price})}else db.fuel.push({id:crypto.randomUUID(),vehicleId:v.id,date:document.getElementById('fdate').value,km,liters,total,price});if(km>v.km)v.km=km;save();editFuelId=null;screen='fuel';render();toast('Repostaje guardado')}
function editFuel(id){editFuelId=id;screen='fuelForm';render()}
function removeFuel(id){openModal('Eliminar repostaje','<p>¿Eliminar este repostaje?</p>',`<button onclick="closeModal()">Cancelar</button><button class="danger" onclick="db.fuel=db.fuel.filter(x=>x.id!==id);save();closeModal();render();toast('Repostaje eliminado')">Eliminar</button>`)}
function fuelHTML(){let v=vehicle(selected),arr=db.fuel.filter(f=>f.vehicleId===v.id).sort((a,b)=>Number(b.km)-Number(a.km)),st=fuelStats(v);return `<div class="app">${header('Repostajes')}<div class="card"><div class="row"><b>${esc(v.name)}</b><span>${fmt(v.km)} km</span></div><div class="toolbar" style="margin-top:12px"><button class="primary" onclick="quickFuel()">＋ NUEVO REPOSTAJE</button></div></div><div class="grid"><div class="card"><div class="small muted">Combustible</div><b>${st.liters.toFixed(2)} L</b></div><div class="card"><div class="small muted">Gasto</div><b>${eur(st.cost)}</b></div><div class="card"><div class="small muted">Consumo medio</div><b>${st.avg!=null?st.avg.toFixed(2)+' L/100 km':'—'}</b></div><div class="card"><div class="small muted">Coste/km</div><b>${distanceKm(v)>0?eur(st.cost/distanceKm(v)):'—'}</b></div></div><div class="section">Historial de repostajes</div>${arr.length?arr.map(f=>`<div class="card"><div class="row"><b>${new Date(f.date).toLocaleDateString('es-ES')}</b><span>${fmt(f.km)} km</span></div><div style="margin-top:7px">${Number(f.liters).toFixed(2)} L · ${eur(f.price)}/L</div><div style="margin-top:6px;font-weight:750">${eur(f.total)}</div><div class="recordActions"><button onclick="editFuel('${f.id}')">✏️ Editar</button><button class="danger" onclick="removeFuel('${f.id}')">🗑️ Eliminar</button></div></div>`).join(''):'<div class="card muted">No hay repostajes.</div>'}</div>`}
function partsHTML(){let v=vehicle(selected),arr=db.parts.filter(p=>p.vehicleId===v.id).sort((a,b)=>Number(b.km)-Number(a.km));return `<div class="app">${header('Piezas')}<div class="card"><b>${esc(v.name)}</b><div class="toolbar" style="margin-top:12px"><button class="primary" onclick="addPart()">＋ AÑADIR PIEZA</button></div></div><div class="section">Historial de piezas</div>${arr.length?arr.map(p=>`<div class="card"><div class="row"><b>${esc(p.description||'Pieza')}</b><span>${fmt(p.km)} km</span></div><div class="small muted" style="margin-top:6px">${esc(p.brand||'')} ${p.reference?'· Ref. '+esc(p.reference):''}</div><div style="margin-top:6px">${new Date(p.date).toLocaleDateString('es-ES')} · ${eur(p.cost)}</div>${p.notes?`<div class="sub small" style="margin-top:6px">${esc(p.notes)}</div>`:''}<div class="recordActions"><button onclick="editPart('${p.id}')">✏️ Editar</button><button class="danger" onclick="removePart('${p.id}')">🗑️ Eliminar</button></div></div>`).join(''):'<div class="card muted">No hay piezas registradas.</div>'}</div>`}
function addPart(){editPartId=null;openPartModal()}
function editPart(id){editPartId=id;openPartModal()}
function openPartModal(){let v=vehicle(selected),p=editPartId?db.parts.find(x=>x.id===editPartId):null;openModal(p?'Editar pieza':'Añadir pieza',`<div class="field"><label>Descripción</label><input id="pd" value="${esc(p?.description||'')}"></div><div class="field"><label>Marca</label><input id="pb" value="${esc(p?.brand||'')}"></div><div class="field"><label>Referencia</label><input id="pr" value="${esc(p?.reference||'')}"></div><div class="field"><label>Kilómetros</label><input id="pk" type="number" value="${p?.km??v.km}"></div><div class="field"><label>Coste (€)</label><input id="pc" type="number" step="0.01" inputmode="decimal" value="${p?.cost??''}"></div><div class="field"><label>Notas</label><textarea id="pn">${esc(p?.notes||'')}</textarea></div>`,`<button onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePart()">Guardar</button>`)}
function savePart(){let v=vehicle(selected),description=document.getElementById('pd').value.trim();if(!description)return toast('Pon una descripción');let data={description,brand:document.getElementById('pb').value,reference:document.getElementById('pr').value,km:Number(document.getElementById('pk').value||v.km),cost:Number(document.getElementById('pc').value||0),notes:document.getElementById('pn').value};if(editPartId){Object.assign(db.parts.find(x=>x.id===editPartId),data)}else db.parts.push({id:crypto.randomUUID(),vehicleId:v.id,date:new Date().toISOString().slice(0,10),...data});save();editPartId=null;closeModal();render();toast('Pieza guardada')}
function removePart(id){openModal('Eliminar pieza','<p>¿Eliminar esta pieza?</p>',`<button onclick="closeModal()">Cancelar</button><button class="danger" onclick="db.parts=db.parts.filter(x=>x.id!==id);save();closeModal();render();toast('Pieza eliminada')">Eliminar</button>`)}
function additionalHTML(){const v=vehicle(selected),a=v.additional||{};return `<div class="app">${header('Datos adicionales')}<div class="card"><b>${esc(v.name)}</b><div class="small muted" style="margin-top:5px">Información técnica actual. No se contabiliza en gastos.</div></div><div class="form"><div class="section">🛞 Neumáticos</div><div class="field"><label>Delanteros · tipo / modelo</label><input id="tyreFront" value="${esc(a.tyreFront||'')}"></div><div class="field"><label>Traseros · tipo / modelo</label><input id="tyreRear" value="${esc(a.tyreRear||'')}"></div><button onclick="clearAdditional('tyres')">🗑️ Limpiar neumáticos</button></div><div class="form"><div class="section">🔋 Batería</div><div class="field"><label>Tipo</label><input id="batType" value="${esc(a.batteryType||'')}"></div><div class="field"><label>Tamaño / capacidad</label><input id="batSize" value="${esc(a.batterySize||'')}" placeholder="Ej.: 95 Ah AGM"></div><button onclick="clearAdditional('battery')">🗑️ Limpiar batería</button></div><div class="form"><div class="section">🛡️ Seguro</div><div class="field"><label>Compañía</label><input id="ins" value="${esc(a.insurance||'')}"></div><div class="field"><label>Nº póliza</label><input id="inspol" value="${esc(a.insurancePolicy||'')}"></div><div class="field"><label>Inicio</label><input id="insstart" type="date" value="${esc(a.insuranceStart||'')}"></div><div class="field"><label>Vencimiento</label><input id="insend" type="date" value="${esc(a.insuranceEnd||'')}"></div><button onclick="clearAdditional('insurance')">🗑️ Limpiar seguro</button></div><button class="primary" style="width:100%" onclick="saveAdditional()">GUARDAR DATOS</button></div>`}
function clearAdditional(section){let v=vehicle(selected),a=v.additional||{};if(section==='battery'){a.batteryType='';a.batterySize='';}if(section==='tyres'){a.tyreFront='';a.tyreRear='';}if(section==='insurance'){a.insurance='';a.insurancePolicy='';a.insuranceStart='';a.insuranceEnd='';}v.additional=a;save();render();toast('Datos actualizados')}
function saveAdditional(){let v=vehicle(selected),a=v.additional||{};v.additional={...a,batteryType:document.getElementById('batType').value.trim(),batterySize:document.getElementById('batSize').value.trim(),tyreFront:document.getElementById('tyreFront').value.trim(),tyreRear:document.getElementById('tyreRear').value.trim(),insurance:document.getElementById('ins').value.trim(),insurancePolicy:document.getElementById('inspol').value.trim(),insuranceStart:document.getElementById('insstart').value,insuranceEnd:document.getElementById('insend').value};save();screen='vehicle';render();toast('Datos guardados')}
function obligationsHTML(){const v=vehicle(selected),arr=db.obligations.filter(o=>o.vehicleId===v.id).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return `<div class="app">${header('Impuestos y obligaciones')}<div class="card"><b>${esc(v.name)}</b><div class="small muted" style="margin-top:5px">Historial de seguros, viñetas, ITV, multas y otros.</div></div><div class="reportBtns"><button class="primary" onclick="editObligationId=null;openObligationModal()">＋ Nueva entrada</button></div>${arr.length?arr.map(o=>`<div class="card"><div class="row"><div><b>${esc(o.type)}</b><div class="small muted">${o.date?new Date(o.date).toLocaleDateString('es-ES'):''}</div></div><b>${o.cost!=null&&o.cost!==''?eur(o.cost):'—'}</b></div>${o.type==='ITV'?`<div style="margin-top:8px;font-weight:800">${o.status==='desfavorable'?'🔴 Desfavorable':'🟢 Favorable'}</div>${o.status==='desfavorable'&&o.reason?`<div class="small" style="margin-top:8px"><b>Motivo:</b> ${esc(o.reason)}</div>`:''}`:''}${o.notes?`<div class="small" style="margin-top:8px">${esc(o.notes)}</div>`:''}<div class="recordActions"><button onclick="editObligation('${o.id}')">✏️ Editar</button><button class="danger" onclick="removeObligation('${o.id}')">🗑️ Eliminar</button></div></div>`).join(''):'<div class="card muted">No hay registros.</div>'}</div>`}
function openObligationModal(id=null){const v=vehicle(selected),o=id?db.obligations.find(x=>x.id===id):null,st=o?.status||'favorable';openModal(id?'Editar entrada':'Nueva entrada',`<div class="field"><label>Fecha</label><input id="odate" type="date" value="${o?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Tipo</label><select id="otype" onchange="toggleObligationFields()"><option ${o?.type==='Seguro'?'selected':''}>Seguro</option><option ${o?.type==='Viñeta / impuesto'?'selected':''}>Viñeta / impuesto</option><option ${o?.type==='ITV'?'selected':''}>ITV</option><option ${o?.type==='Multa'?'selected':''}>Multa</option><option ${o?.type==='Otros'?'selected':''}>Otros</option></select></div><div id="itvFields" style="${o?.type==='ITV'?'':'display:none'}"><div class="field"><label>Resultado</label><select id="ostatus"><option value="favorable" ${st==='favorable'?'selected':''}>🟢 Favorable</option><option value="desfavorable" ${st==='desfavorable'?'selected':''}>🔴 Desfavorable</option></select></div><div class="field"><label>Motivo / defectos si es desfavorable</label><textarea id="oreason">${esc(o?.reason||'')}</textarea></div></div><div class="field"><label>Coste (€) · opcional</label><input id="ocost" type="number" step="0.01" inputmode="decimal" value="${o?.cost??''}"></div><div class="field"><label>Notas / descripción</label><textarea id="onotes">${esc(o?.notes||'')}</textarea></div>`,`<button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveObligation(${id?`'${id}'`:'null'})">Guardar</button>`)}
function toggleObligationFields(){const show=document.getElementById('otype')?.value==='ITV',el=document.getElementById('itvFields');if(el)el.style.display=show?'block':'none'}
function editObligation(id){editObligationId=id;openObligationModal(id)}
function saveObligation(id){const v=vehicle(selected),date=document.getElementById('odate').value,type=document.getElementById('otype').value,costRaw=document.getElementById('ocost').value.trim(),cost=costRaw===''?null:Number(costRaw),status=type==='ITV'?(document.getElementById('ostatus')?.value||'favorable'):'',reason=type==='ITV'&&status==='desfavorable'?(document.getElementById('oreason')?.value.trim()||''):'';if(!date||!isFinite(cost??0)||((cost??0)<0))return toast('Revisa la fecha y el coste');if(type==='ITV'&&status==='desfavorable'&&!reason)return toast('Indica el motivo de la ITV desfavorable');let item={id:id||crypto.randomUUID(),vehicleId:v.id,date,type,cost,status,reason,notes:document.getElementById('onotes').value.trim()};if(id){let idx=db.obligations.findIndex(x=>x.id===id);if(idx>=0)db.obligations[idx]=item}else db.obligations.push(item);save();editObligationId=null;closeModal();screen='obligations';render();toast('Entrada guardada')}
function removeObligation(id){openModal('Eliminar entrada','<p>¿Eliminar este registro?</p>',`<button onclick="closeModal()">Cancelar</button><button class="danger" onclick="db.obligations=db.obligations.filter(x=>x.id!==id);save();closeModal();render();toast('Entrada eliminada')">Eliminar</button>`)}
function maintenanceHTML(){let all=[];db.vehicles.forEach(v=>db.maintenance.filter(m=>m.next).forEach(m=>{let km=m.next.km!=null?m.next.km-v.km:null,days=m.next.date?Math.ceil((new Date(m.next.date)-new Date())/86400000):null;all.push({v,m,km,days})}));all.sort((a,b)=>Math.min(a.km??999999999,(a.days??999999)*1000)-Math.min(b.km??999999999,(b.days??999999)*1000));return `<div class="app">${header('Mantenimientos',true)}${['🔴 Pendientes','🟠 Próximamente','🟢 Más adelante'].map((g,i)=>{let rows=all.filter(x=>i===0?((x.km!=null&&x.km<=0)||(x.days!=null&&x.days<=0)):i===1?((x.km!=null&&x.km>0&&x.km<=2000)||(x.days!=null&&x.days>0&&x.days<=60)):true).slice(0,i===2?20:10);return `<div class="section">${g}</div>${rows.map(x=>`<div class="card" onclick="selected='${x.v.id}';screen='record';recTypes=[];render()"><b>${esc(x.v.name)}</b><div class="small muted">${fmt(x.v.km)} km</div><div style="margin-top:7px">${esc(x.m.type)} · ${x.km!=null?(x.km<=0?'Pendiente':'En '+fmt(x.km)+' km'):(x.days<=0?'Pendiente':'En '+x.days+' días')}</div></div>`).join('')||'<div class="card muted">Nada aquí.</div>'}`}).join('')}</div><div class="bottom"><button onclick="home()">🏠 Vehículos</button><button onclick="screen='expenses';render()">💰 Gastos</button></div>`}
function expensesHTML(){const sv=expenseVehicle==='all'?null:vehicle(expenseVehicle),vs=sv?[sv]:db.vehicles,[from,to]=periodRange();const sums=vs.reduce((a,v)=>{let c=costBreakdown(v,from,to);a.maintenance+=c.maintenance;a.parts+=c.parts;a.fuel+=c.fuel;a.obligations+=c.obligations;a.total+=c.total;return a},{maintenance:0,parts:0,fuel:0,obligations:0,total:0});return `<div class="app">${header('Gastos',true)}<div class="form"><div class="field"><label>Vehículo</label><select onchange="expenseVehicle=this.value;render()"><option value="all">Todos los vehículos</option>${db.vehicles.map(v=>`<option value="${v.id}" ${expenseVehicle===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>Período</label><select onchange="expensePeriod=this.value;render()"><option value="all" ${expensePeriod==='all'?'selected':''}>Todo</option><option value="month" ${expensePeriod==='month'?'selected':''}>Este mes</option><option value="3m" ${expensePeriod==='3m'?'selected':''}>Últimos 3 meses</option><option value="year" ${expensePeriod==='year'?'selected':''}>Este año</option><option value="12m" ${expensePeriod==='12m'?'selected':''}>Últimos 12 meses</option><option value="custom" ${expensePeriod==='custom'?'selected':''}>Personalizado</option></select></div>${expensePeriod==='custom'?`<div class="field"><label>Desde</label><input type="date" value="${expenseFrom}" onchange="expenseFrom=this.value;render()"></div><div class="field"><label>Hasta</label><input type="date" value="${expenseTo}" onchange="expenseTo=this.value;render()"></div>`:''}</div><div class="card"><div class="sub">${sv?esc(sv.name):'Todos los vehículos'}</div><div class="expense">${eur(sums.total)}</div><div class="line"><div class="row"><span>🔧 Mantenimiento</span><b>${eur(sums.maintenance)}</b></div></div><div class="line"><div class="row"><span>🔩 Piezas</span><b>${eur(sums.parts)}</b></div></div><div class="line"><div class="row"><span>⛽ Combustible</span><b>${eur(sums.fuel)}</b></div></div><div class="line"><div class="row"><span>🧾 Impuestos y obligaciones</span><b>${eur(sums.obligations)}</b></div></div><div class="row" style="margin-top:12px"><b>GASTO TOTAL</b><b>${eur(sums.total)}</b></div>${sv?`<div class="row" style="margin-top:8px"><b>Coste/km del período</b><b>${costPerKm(sv,from,to)!=null?eur(costPerKm(sv,from,to))+' / km':'—'}</b></div>`:''}</div><div class="reportBtns"><button onclick="exportExcelForVehicle('${sv?sv.id:'all'}')">📊 Exportar Excel</button></div>${!sv?`<div class="section">Por vehículo</div>${db.vehicles.map(v=>{let c=costBreakdown(v,from,to);return `<div class="card" onclick="expenseVehicle='${v.id}';render()"><div class="row"><b>${kindIcon(v)} ${esc(v.name)}</b><b>${eur(c.total)}</b></div><div class="small muted" style="margin-top:7px">🔧 ${eur(c.maintenance)} · 🔩 ${eur(c.parts)} · ⛽ ${eur(c.fuel)} · 🧾 ${eur(c.obligations)}</div></div>`}).join('')||'<div class="card muted">No hay vehículos.</div>'}`:''}</div>`}

function excelEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildExcelRows(vehicleIds){const rows=[['Vehículo','Tipo','Fecha','Kilómetros','Descripción','Marca','Referencia','Litros','€/litro','Coste','Notas','Resultado ITV']];const ids=new Set(vehicleIds);db.maintenance.filter(m=>ids.has(m.vehicleId)).forEach(m=>rows.push([vehicle(m.vehicleId)?.name||'','Mantenimiento',m.date,m.km,(m.types||[]).map(t=>t==='Otros'&&m.otherText?'Otros — '+m.otherText:t).join(' + '),'','','','',m.total||0,m.notes||'','']));db.parts.filter(p=>ids.has(p.vehicleId)).forEach(p=>rows.push([vehicle(p.vehicleId)?.name||'','Pieza',p.date,p.km,p.description||'',p.brand||'',p.reference||'','','',p.cost||0,p.notes||'','']));db.fuel.filter(f=>ids.has(f.vehicleId)).forEach(f=>rows.push([vehicle(f.vehicleId)?.name||'','Combustible',f.date,f.km,'Repostaje','','',f.liters||0,f.price||0,f.total||0,'','']));db.obligations.filter(o=>ids.has(o.vehicleId)).forEach(o=>rows.push([vehicle(o.vehicleId)?.name||'',o.type,o.date,'',o.type==='ITV'?(o.reason||'ITV'):(o.notes||''),'','','','',o.cost??' ',o.notes||'',o.type==='ITV'?(o.status==='desfavorable'?'Desfavorable':'Favorable'):'']));return rows}
function exportExcelForVehicle(idOrAll){
  const ids=idOrAll==='all'?db.vehicles.map(v=>v.id):[idOrAll];
  const rows=buildExcelRows(ids);
  const body=rows.map((r,i)=>'<tr>'+r.map(c=>'<td>'+excelEsc(c)+'</td>').join('')+'</tr>').join('');
  const title=idOrAll==='all'?'Vehiculos - Toda la flota':(vehicle(idOrAll)?.name||'Vehiculo');
  const xls='<!doctype html><html><head><meta charset="utf-8"></head><body><table border="1">'+body+'</table></body></html>';
  if(window.Android&&Android.generateExcel){Android.generateExcel(title.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ _-]/g,'_')+'.xls',xls);return}
  const blob=new Blob([xls],{type:'application/vnd.ms-excel'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=title.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ _-]/g,'_')+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Excel generado')
}
function backupData(){if(window.Android&&Android.createBackup){Android.createBackup('mantenimiento_vehiculos_backup.json',JSON.stringify(db));}else toast('Copia de seguridad no disponible')}
function restoreData(){if(window.Android&&Android.importBackup){Android.importBackup();}else toast('Restauración no disponible')}
window.onBackupImported=function(text){try{let incoming=JSON.parse(text);if(!incoming||!Array.isArray(incoming.vehicles)||!Array.isArray(incoming.maintenance)||!Array.isArray(incoming.obligations||[]))throw new Error('Formato no válido');db=incoming;db.obligations=db.obligations||[];db.vehicles.forEach(v=>v.additional=v.additional||{});db.migrationFlags=db.migrationFlags||{};save();migrate();selected=null;screen='home';render();toast('Copia restaurada correctamente')}catch(e){toast('La copia no es válida')}}
render();
</script></body></html>
